  <style>
    /* Offset for fixed header */

    .artist-info h1 {

      font-size: clamp(2rem, 4vw, 3rem);

    }
    .artist-role {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(107, 76, 122, 0.3);
      border-radius: 999px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }
    .artist-bio {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #ccc;
      margin-bottom: 2rem;
    }
    .artist-links {
      display: flex;
      gap: 12px;

    }
    .artist-links a {
      display: inline-flex;

      gap: 8px;

    }
    .releases-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    @media (max-width: 768px) {
      .artist-hero {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .artist-photo {
        max-width: 280px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <script>
    fetch("/header.html")
      .then(r => r.text())
      .then(html => {
        document.body.insertAdjacentHTML("afterbegin", html);
        const btn = document.getElementById("menu-toggle");
        const nav = document.querySelector(".main-nav");
        if(btn && nav){
          btn.addEventListener("click", () => {
            const open = nav.classList.toggle("open");
            btn.textContent = open ? "✖" : "☰";
          });
          document.addEventListener("click", e => {
            if(e.target.closest(".nav-links a")){
              nav.classList.remove("open");
              btn.textContent = "☰";
            }
          });
        }
      });
  </script>

        <div class="artist-info">

          <span class="artist-role">producer</span>
          <p class="artist-bio">''</p>
          <div class="artist-links">
            
    <a href="https://open.spotify.com/artist/4TSLRQcJGybQuNA8ybueEy?si=EuK0SlTPQwOtjsQ4iDAPSg" target="_blank" rel="noopener">

    </a>
  
    <a href="''" target="_blank" rel="noopener">
      <i class="fa-brands fa-bandcamp"></i> Bandcamp
    </a>
  
          </div>
        </div>
      </div>
      
      <div class="artist-releases">
        <h2>Releases on Oysterdale</h2>

  <script>
    fetch("/footer.html")
      .then(r => r.text())
      .then(html => document.body.insertAdjacentHTML("beforeend", html));
  </script>

  <script>
    // Load releases for this artist
    async function loadReleases() {
      try {
        const r = await fetch('https://api.github.com/repos/Oysterdale/oysterdale-site/contents/releases');
        const files = await r.json();
        const releases = [];
        
        for(const file of files.filter(f => f.name.endsWith('.md'))) {
          const md = await fetch(file.download_url).then(r => r.text());
          const { data } = parseFrontmatter(md);
          
          if(data.artists && data.artists.some(a => 
            a.toLowerCase().includes('art of tones') || 
            'art of tones'.includes(a.toLowerCase())
          )) {
            releases.push(data);
          }
        }
        
        const container = document.getElementById('artist-releases');
        if(releases.length === 0) {
          container.innerHTML = '<p>No releases yet.</p>';
          return;
        }
        
        container.innerHTML = releases.map(r => `
          <div class="release">
            <a href="/releases/${r.title.toLowerCase().replace(/\s+/g, '-')}.html">
              <img src="${r.cover || r.image}" alt="${r.title}" class="release-cover" loading="lazy">
              <h3>${r.title}</h3>
              <p>${r.artists.join(' | ')}</p>
            </a>
          </div>
        `).join('');
        
      } catch(e) {
        console.error(e);
      }
    }
    
    function parseFrontmatter(md) {
      const parts = md.split('---');
      if(parts.length < 3) return {data: {}};
      const yaml = parts[1];
      const data = {};
      const lines = yaml.split(/\r?\n/);
      
      let listKey = null;
      for(const line of lines){
        if(!line.trim()) continue;
        const listStart = line.match(/^([A-Za-z0-9_]+):\s*$/);
        if(listStart){
          listKey = listStart[1];
          data[listKey] = [];
          continue;
        }
        if(listKey && line.trim().startsWith("-")){
          data[listKey].push(line.replace(/^\s*-\s*/, "").trim());
          continue;
        }
        const field = line.match(/^([^:]+):\s*(.*)$/);
        if(field){
          data[field[1].trim()] = field[2].replace(/^["']|["']$/g, "");
        }
      }
      
      if(data.artists){
        if(Array.isArray(data.artists)){
          data.artists = data.artists.map(a => 
            typeof a === "string" ? a : (a.existing || a.custom || "")
          ).filter(Boolean);
        } else {
          data.artists = [String(data.artists).trim()];
        }
      }
      
      return {data};
    }
    
    loadReleases();
  </script>
</body>
</html>
