  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" crossorigin="" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin=""></noscript>
  <style>
    /* Force white text */
    body {
      background: linear-gradient(135deg, #050505 0%, #0a0a1a 50%, #0d1117 100%) !important;
      background-attachment: fixed !important;
      color: #fff !important;
      min-height: 100vh;

    }
    /* Offset for fixed header */

    .artist-hero {

      grid-template-columns: 300px 1fr;

    .artist-photo {

      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
    }
    .artist-info {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .artist-info h1 {
      margin: 0;
      font-size: clamp(2.5rem, 5vw, 4rem);
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .artist-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .artist-links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      font-size: 0.9rem;
      transition: background 0.2s;
      color: #fff !important;
      text-decoration: none;
    }
    .artist-links a:hover {
      background: rgba(255,255,255,0.12);
    }
    .artist-bio-full {
      margin: 2rem 0;
      max-width: 800px;
    }
    .artist-bio-full p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #ccc;
    }
    .artist-releases {
      margin-top: 4rem;
    }
    .artist-releases h2 {
      margin-bottom: 1.5rem;
    }
    .releases-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    @media (max-width: 768px) {
      .artist-hero {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .artist-photo {
        max-width: 280px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <script>
    fetch("/header.html")
      .then(r => r.text())
      .then(html => {
        document.body.insertAdjacentHTML("afterbegin", html);
        const btn = document.getElementById("menu-toggle");
        const nav = document.querySelector(".main-nav");
        if(btn && nav){
          btn.addEventListener("click", () => {
            const open = nav.classList.toggle("open");
            btn.textContent = open ? "✖" : "☰";
          });
          document.addEventListener("click", e => {
            if(e.target.closest(".nav-links a")){
              nav.classList.remove("open");
              btn.textContent = "☰";
            }
          });
        }
      });
  </script>

        <div class="artist-info">
          <h1>Sebastian Emes</h1>
          <div class="artist-links">
            
    <a href="https://open.spotify.com/artist/7aGq0wr1mgg1tLgdwOX8cF" target="_blank" rel="noopener">
      <i class="fa-brands fa-spotify"></i> Spotify
    </a>
  
    <a href="https://www.sebastianemes.com/" target="_blank" rel="noopener">
      <i class="fa-solid fa-globe"></i> Website
    </a>
  
    <a href="https://www.traxsource.com/artist/512480/sebastian-emes" target="_blank" rel="noopener">
      <i class="fa-solid fa-music"></i> Traxsource
    </a>
  
    <a href="https://music.apple.com/us/artist/sebastian-emes/459097645" target="_blank" rel="noopener">
      <i class="fa-brands fa-apple"></i> Apple Music
    </a>
  
    <a href="https://tidal.com/browse/artist/5684729" target="_blank" rel="noopener">
      <i class="fa-solid fa-wave-square"></i> Tidal
    </a>
  
          </div>
        </div>
      </div>
      
      <div class="artist-bio-full">
        <p>''</p>
      </div>
      
      <div class="artist-releases">
        <h2>Oysterdale Releases</h2>
        <div class="releases-grid" id="artist-releases"></div>
      </div>

  </main>

  <script>
    fetch("/footer.html")
      .then(r => r.text())
      .then(html => document.body.insertAdjacentHTML("beforeend", html));
  </script>

  <script>
    const OWNER = "Oysterdale";
    const REPO = "oysterdale-site";
    
    async function loadReleases() {
      try {
        const r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/releases');
        const files = await r.json();
        const releases = [];
        
        for(const file of files.filter(f => f.name.endsWith('.md'))) {
          const md = await fetch(file.download_url).then(r => r.text());
          const data = parseFrontmatter(md);
          
          if(data.artists && data.artists.some(a => 
            a.toLowerCase().includes('sebastian emes') || 
            'sebastian emes'.includes(a.toLowerCase())
          )) {
            releases.push(data);
          }
        }
        
        const container = document.getElementById('artist-releases');
        if(releases.length === 0) {
          container.innerHTML = '<p>No releases yet.</p>';
          return;
        }
        
        container.innerHTML = releases.map(function(r) {
          var releaseSlug = r.title.toLowerCase().replace(/\s+/g, '-');
          return '<div class="release">' +
            '<a href="/releases/' + releaseSlug + '/">' +
            '<img src="' + (r.cover || r.image) + '" alt="' + r.title + '" class="release-cover" loading="lazy">' +
            '<h3>' + r.title + '</h3>' +
            '<p>' + r.artists.join(' | ') + '</p>' +
            '</a>' +
            '</div>';
        }).join('');
        
      } catch(e) {
        console.error(e);
      }
    }
    
    function parseFrontmatter(md) {
      var parts = md.split('---');
      if(parts.length < 3) return {data: {}};
      var yaml = parts[1];
      var data = {};
      var lines = yaml.split(/\r?\n/);
      
      var listKey = null;
      for(var i = 0; i < lines.length; i++){
        var line = lines[i];
        if(!line.trim()) continue;
        
        var listStart = line.match(/^([A-Za-z0-9_]+):\s*$/);
        if(listStart){
          listKey = listStart[1];
          data[listKey] = [];
          continue;
        }
        
        if(listKey && line.trim().startsWith("-")){
          data[listKey].push(line.replace(/^\s*-\s*/, "").trim());
          continue;
        }
        
        var field = line.match(/^([^:]+):\s*(.*)$/);
        if(field){
          data[field[1].trim()] = field[2].replace(/^["']|["']$/g, "");
        }
      }
      
      if(data.artists){
        if(Array.isArray(data.artists)){
          data.artists = data.artists.map(function(a) {
            return typeof a === "string" ? a : (a.existing || a.custom || "");
          }).filter(Boolean);
        } else {
          data.artists = [String(data.artists).trim()];
        }
      }
      
      return data;
    }
    
    loadReleases();
  </script>
</body>
</html>
