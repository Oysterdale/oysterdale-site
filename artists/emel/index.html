<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emél | Oysterdale Records</title>
  <meta name="description" content="''">
  <link rel="stylesheet" href="/styles.css?v=2">
  <link rel="stylesheet" href="/styles-news.css">
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" crossorigin="" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin=""></noscript>
  <style>
    /* Force white text */
    body {
      background: linear-gradient(135deg, #050505 0%, #0a0a1a 50%, #0d1117 100%) !important;
      background-attachment: fixed !important;
      color: #fff !important;
      min-height: 100vh;
    }
    
    .artist-hero {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 3rem;
      align-items: start;
      margin: 2rem 0;
    }
    
    .artist-photo {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
    }
    
    .artist-info h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 4vw, 3rem);
    }
    
    .artist-role {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(107, 76, 122, 0.3);
      border-radius: 999px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }
    
    .artist-bio {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #ccc;
      margin-bottom: 2rem;
    }
    
    .artist-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    
    .artist-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: rgba(107, 76, 122, 0.2);
      border: 1px solid rgba(107, 76, 122, 0.3);
      border-radius: 8px;
      color: #fff !important;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    
    .artist-links a:hover {
      background: rgba(107, 76, 122, 0.4);
      transform: translateY(-2px);
    }
    
    .artist-releases {
      margin-top: 3rem;
    }
    
    .artist-releases h2 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }
    
    @media (max-width: 768px) {
      .artist-hero {
        grid-template-columns: 1fr;
        text-align: center;
      }
      
      .artist-photo {
        max-width: 250px;
        margin: 0 auto;
      }
      
      .artist-links {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="container" style="padding-top: 100px;">
    <div class="artist-hero">
      <img src="/uploads/okplus_portrett_square_top_1200x1200.jpg" alt="Emél" class="artist-photo">
      <div class="artist-info">
        <h1>Emél</h1>
        <span class="artist-role">vocalist</span>
        <p class="artist-bio">''</p>
        <div class="artist-links">
          
    <a href="https://open.spotify.com/artist/3DABbjPF97i0tEMgdM7BE3" target="_blank" rel="noopener">
      <i class="fa-brands fa-spotify"></i> Spotify
    </a>
  
    <a href="https://www.traxsource.com/artist/943771/emel" target="_blank" rel="noopener">
      <i class="fa-solid fa-music"></i> Traxsource
    </a>
  
    <a href="https://music.apple.com/gb/artist/em%C3%A9l/1575911756" target="_blank" rel="noopener">
      <i class="fa-brands fa-apple"></i> Apple Music
    </a>
  
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  
  <script src="/js/header-footer.js"></script>
</body>
</html>
