<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist | Oysterdale Records</title>
  <meta name="description" content="Discover artists on Oysterdale Records.">
  <link rel="stylesheet" href="/styles.css?v=2">
  <link rel="stylesheet" href="/styles-news.css">
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" crossorigin="" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin=""></noscript>
  <style>
    .page-content { padding-top: 100px; }
    .artist-hero {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 3rem;
      align-items: start;
      margin: 2rem 0;
    }
    .artist-photo {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
    }
    .artist-info h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 4vw, 3rem);
      color: #fff;
    }
    .artist-role {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(107, 76, 122, 0.3);
      border-radius: 999px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }
    .artist-bio-full p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #ccc;
      margin-bottom: 1rem;
    }
    .artist-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }
    .artist-links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .artist-links a:hover {
      background: rgba(255,255,255,0.12);
    }
    .artist-releases {
      margin-top: 4rem;
    }
    .artist-releases h2 {
      margin-bottom: 1.5rem;
    }
    .releases-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    @media (max-width: 768px) {
      .artist-hero {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .artist-photo {
        max-width: 280px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <script>
    fetch("/header.html")
      .then(r => r.text())
      .then(html => {
        document.body.insertAdjacentHTML("afterbegin", html);
        if (window.setActiveNav) window.setActiveNav();
        const btn = document.getElementById("menu-toggle");
        const nav = document.querySelector(".main-nav");
        if(btn && nav){
          btn.addEventListener("click", () => {
            const open = nav.classList.toggle("open");
            btn.textContent = open ? "✖" : "☰";
          });
        }
      });
  </script>

  <main class="page-content">
    <div id="artist-content">
      <p>Loading artist...</p>
    </div>
  </main>

  <script>
    fetch("/footer.html")
      .then(r => r.text())
      .then(html => document.body.insertAdjacentHTML("beforeend", html));
  </script>

  <script src="/js/artist-loader.js?v=2"></script>
</body>
</html>
