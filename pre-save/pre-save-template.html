<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{{page_title}} | Oysterdale Records</title>
  <meta name="description" content="{{meta_description}}">
  <meta property="og:title" content="{{page_title}} | Oysterdale Records">
  <meta property="og:description" content="{{meta_description}}">
  <meta property="og:type" content="music.album">
  <meta property="og:url" content="https://oysterdalerecords.com/pre-save/{{slug}}/">
  <meta property="og:image" content="{{og_image}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <style>
    :root {
      --bg: #0d0d12;
      --card: #16161d;
      --text: #f2f2f5;
      --muted: #9a9aa8;
      --accent1: #6b4c7a;
      --accent2: #9b7bb8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 3rem;
    }
    .brand {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      font-weight: 700;
      letter-spacing: .12em;
      font-size: .85rem;
      color: var(--muted);
      text-decoration: none;
      text-transform: uppercase;
    }
    .brand:hover { color: var(--text); }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 20px;
      padding: 2rem 1.5rem 2.25rem;
      text-align: center;
    }
    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      margin-bottom: 1.5rem;
      background: #000;
    }
    h1 {
      font-size: clamp(1.5rem, 6vw, 2rem);
      letter-spacing: .04em;
      text-transform: uppercase;
      line-height: 1.15;
      margin-bottom: .4rem;
    }
    .artist {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: .35rem;
    }
    .date {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 1.75rem;
    }
    .presave-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      width: 100%;
      padding: 1rem 1.25rem;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .presave-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(155,123,184,.35); }
    .presave-btn svg { width: 22px; height: 22px; flex: none; }
    .secondary {
      display: inline-block;
      margin-top: 1rem;
      color: var(--muted);
      font-size: .85rem;
      text-decoration: none;
    }
    .secondary:hover { color: var(--text); }
    .note {
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: .85rem;
      display: {{missing_notice_display}};
    }
    .consent-bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 1rem;
      width: min(92vw, 460px);
      background: #1e1e26;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      font-size: .85rem;
      color: var(--muted);
      display: none;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }
    .consent-bar p { margin-bottom: .75rem; }
    .consent-actions { display: flex; gap: .5rem; }
    .consent-actions button {
      flex: 1;
      padding: .55rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.15);
      background: transparent;
      color: var(--text);
      font-size: .85rem;
      cursor: pointer;
    }
    .consent-actions button.accept { background: linear-gradient(135deg, var(--accent1), var(--accent2)); border: none; font-weight: 600; }
    @media (min-width: 480px) {
      body { padding: 3rem 2rem; }
      .card { padding: 2.5rem 2.25rem 2.75rem; }
    }
  </style>
</head>
<body>
  <a class="brand" href="/">Oysterdale Records</a>

  <main class="card">
    {{cover_img}}
    <h1>{{title}}</h1>
    <p class="artist">{{artists}}</p>
    <p class="date">Out on Spotify {{release_date_display}}</p>

    {{presave_button}}

    <p class="note" id="missing-note">The release page isn&rsquo;t live yet &mdash; this pre-save page stays up until it is.</p>
  </main>

  {{pixel_snippet}}

  <script id="pre-save-config" type="application/json">{{config_json}}</script>
  <script>
  (function () {
    var cfg = {};
    try { cfg = JSON.parse(document.getElementById('pre-save-config').textContent); } catch (e) {}

    // Meta Pixel events (only loaded at all when a Pixel ID is configured in the CMS)
    function firePixel(eventName) {
      if (!cfg.meta_pixel_id || typeof fbq !== 'function') return;
      if (!localStorage.getItem('oy_consent_marketing')) return;
      fbq('trackCustom', eventName);
    }
    firePixel('PreSavePageView');

    var btn = document.getElementById('presave-btn');
    if (btn) {
      btn.addEventListener('click', function () { firePixel('PreSaveButtonClick'); });
    }

    // Redirect to the public release page once the Spotify release date has passed
    function releaseMoment() {
      if (!cfg.release_date) return null;
      var d = new Date(cfg.release_date + 'T00:00:00');
      if (isNaN(d)) return null;
      return d;
    }

    function maybeRedirect() {
      var m = releaseMoment();
      if (!m) return;
      if (cfg.keep_pre_save) return;
      var tz = cfg.timezone || 'Europe/Oslo';
      try {
        // Current time expressed in the release timezone
        var nowParts = new Intl.DateTimeFormat('en-US', {
          timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        }).formatToParts(new Date());
        var map = {};
        nowParts.forEach(function (p) { map[p.type] = p.value; });
        var nowInTz = new Date(map.year + '-' + map.month + '-' + map.day + 'T' + map.hour + ':' + map.minute + ':' + map.second + 'Z');
        nowInTz = new Date(nowInTz.getTime() + nowInTz.getTimezoneOffset() * 60000);
        if (nowInTz < m) {
          // Check again at the release moment
          setTimeout(maybeRedirect, Math.min(m - nowInTz + 2000, 3600000));
          return;
        }
      } catch (e) {
        if (new Date() < m) return; // timezone unsupported: fall back to visitor-local midnight
      }

      // Release moment reached: redirect only if the public release page exists
      fetch('/releases.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (releases) {
          var found = (releases || []).some(function (r) { return r.slug === cfg.release_slug; });
          if (found) {
            window.location.replace('/releases/' + cfg.release_slug + '/');
          } else {
            document.getElementById('missing-note').style.display = 'block';
          }
        })
        .catch(function () { /* offline etc: stay on page */ });
    }
    maybeRedirect();
  })();
  </script>
</body>
</html>
