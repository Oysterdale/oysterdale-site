<script>
  // Last inn header og initier meny
  fetch('header.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('main-header').innerHTML = html;

      const toggleButton = document.getElementById('menu-toggle');
      const nav = document.querySelector('.main-nav');
      const navLinks = document.querySelectorAll('.main-nav a');

      if (toggleButton && nav) {
        toggleButton.addEventListener('click', () => {
          nav.classList.toggle('open');
          toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
        });

        navLinks.forEach(link => {
          link.addEventListener('click', () => {
            if (nav.classList.contains('open')) {
              nav.classList.remove('open');
              toggleButton.textContent = '☰';
            }
          });
        });
      }
    });

  async function loadRelease(file) {
    const res = await fetch(`/releases/${file}`);
    const text = await res.text();

    const titleMatch = text.match(/title:\s*(.+)/);
    const coverMatch = text.match(/cover:\s*(.+)/);
    const spotifyMatch = text.match(/spotify:\s*(.+)/);
    const traxsourceMatch = text.match(/traxsource:\s*(.+)/);
    const bodyText = text.split('---').pop().trim();

    const fullTitle = titleMatch ? titleMatch[1] : 'Untitled';
    const [artist, track] = fullTitle.split(' - ');
    const cover = coverMatch ? coverMatch[1] : '';
    const spotify = spotifyMatch ? spotifyMatch[1] : '';
    const traxsource = traxsourceMatch ? traxsourceMatch[1] : '';

    return `
      <div class="release">
        <h2 class="release-artist">${artist || ''}</h2>
        <h3 class="release-title">${track || ''}</h3>
        ${cover ? `<a href="${spotify || traxsource || '#'}" target="_blank"><img src="${cover}" alt="${fullTitle}" class="release-cover"></a>` : ''}
        <p>
          ${spotify ? `<a href="${spotify}" target="_blank">Spotify</a>` : ''}
          ${traxsource ? `${spotify ? ' | ' : ''}<a href="${traxsource}" target="_blank">Traxsource</a>` : ''}
        </p>
        <div class="release-body">${marked.parse(bodyText)}</div>
      </div>
    `;
  }

  async function loadAllReleases() {
    const files = [
      "get-on-up-feat-emél.md",
      "okplus-dancing-on-the-clouds-feat-rona-ray.md"
    ];

    const container = document.getElementById('releases-content');
    container.innerHTML = '';

    for (const file of files) {
      try {
        const html = await loadRelease(file);
        container.innerHTML += html;
      } catch (err) {
        console.error(`Klarte ikke laste ${file}:`, err);
      }
    }
  }

  loadAllReleases();
</script>
