<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – Releases</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <main class="page-content">
    <h1>Releases</h1>
    <div id="releases-content" class="releases-grid">Loading releases...</div>
  </main>

  <footer>
    <div class="footer-logo">
      <img src="uploads/OysterdaleRecords_white_logo.png" alt="Oysterdale Records Logo" class="footer-logo-img">
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    // Sett inn header
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.body.insertAdjacentHTML('afterbegin', html);

        const toggleButton = document.getElementById('menu-toggle');
        const nav = document.querySelector('.main-nav');
        const navLinks = document.querySelectorAll('.main-nav a');

        if (toggleButton && nav) {
          toggleButton.addEventListener('click', () => {
            nav.classList.toggle('open');
            toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
          });

          navLinks.forEach(link => {
            link.addEventListener('click', () => {
              if (nav.classList.contains('open')) {
                nav.classList.remove('open');
                toggleButton.textContent = '☰';
              }
            });
          });
        }
      });

    // Hent liste over .md-filer i /releases/
    async function getReleaseFiles() {
      const res = await fetch('/releases/');
      const text = await res.text();
      const matches = [...text.matchAll(/href="([^"]+\.md)"/g)];
      return matches.map(m => m[1]);
    }

    async function loadRelease(file) {
      const res = await fetch(`/releases/${file}`);
      const text = await res.text();

      const artistMatch = text.match(/artist:\s*(.+)/);
      const titleMatch = text.match(/title:\s*(.+)/);
      const featuredMatch = text.match(/featured:\s*(.+)/);
      const dateMatch = text.match(/date:\s*(.+)/);
      const coverMatch = text.match(/cover:\s*(.+)/);
      const spotifyMatch = text.match(/spotify:\s*(.+)/);
      const traxsourceMatch = text.match(/traxsource:\s*(.+)/);
      const bodyText = text.split('---').pop().trim();

      return {
        html: `
          <div class="release">
            <h2 class="release-artist">${artistMatch ? artistMatch[1] : ''}</h2>
            <h3 class="release-title">${titleMatch ? titleMatch[1] : ''}</h3>
            ${(() => { 
              const f = featuredMatch ? featuredMatch[1].trim().replace(/^"|"$/g, '') : ''; 
              return f ? `<p class="release-featured">feat. ${f}</p>` : ''; 
            })()}
            ${coverMatch ? `<a href="${spotifyMatch?.[1] || traxsourceMatch?.[1] || '#'}" target="_blank"><img src="${coverMatch[1]}" alt="${titleMatch ? titleMatch[1] : ''}" class="release-cover"></a>` : ''}
            <p>
              ${spotifyMatch ? `<a href="${spotifyMatch[1]}" target="_blank">Spotify</a>` : ''}
              ${traxsourceMatch ? `${spotifyMatch ? ' | ' : ''}<a href="${traxsourceMatch[1]}" target="_blank">Traxsource</a>` : ''}
            </p>
            <div class="release-body">${marked.parse(bodyText)}</div>
          </div>
        `,
        date: dateMatch ? new Date(dateMatch[1]) : new Date(0)
      };
    }

    async function loadAllReleases() {
      const container = document.getElementById('releases-content');
      container.innerHTML = '';

      const files = await getReleaseFiles();
      const releasePromises = files.map(loadRelease);
      const releases = await Promise.all(releasePromises);

      releases.sort((a, b) => b.date - a.date);
      releases.forEach(release => container.innerHTML += release.html);
    }

    loadAllReleases();
  </script>
</body>
</html>
