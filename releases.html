      <!-- NEWSLETTER AJAX HANDLER -->
      <script>
      (function(){
        const form = document.getElementById('newsletter-form');
        const success = document.getElementById('newsletter-success');
        if(!form) return;
        
        form.addEventListener('submit', function(e){
          e.preventDefault();
          const btn = form.querySelector('button[type="submit"]');
          const originalText = btn.textContent;
          btn.textContent = 'Subscribing...';
          btn.disabled = true;
          
          const data = new FormData(form);
          
          fetch('/', {
            method: 'POST',
            body: data
          })
          .then(function(){
            form.style.display = 'none';
            if(success) success.style.display = 'block';
          })
          .catch(function(){
            btn.textContent = originalText;
            btn.disabled = false;
            alert('Something went wrong. Please try again.');
          });
        });
      })();

      try{
        const res = await fetch('/content/settings/footer.json', {cache:'no-store'});
        const cfg = await res.json();
        const w = Number(cfg.width) || 260;

        const logoSrc = cfg.logo

                   loading="lazy" decoding="async">

        document.body.insertAdjacentHTML("beforeend", html);

    })();

  <!-- RELEASE LOGIC -->
  <script>
    const OWNER="Oysterdale", REPO="oysterdale-site", DIR="releases";

    async function listFiles(){
      const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`);
      return (await r.json()).filter(f => f.type === "file" && f.name.endsWith(".md"));
    }

    function parseFrontmatter(md){
      const parts = md.split('---');
      if(parts.length < 3) return {data:{}};

      const yaml = parts[1];
      const data = {};
      const lines = yaml.split(/\r?\n/);

      let listKey = null;
      let inLinks = false;

      for(const line of lines){
        if(!line.trim()) continue;

        if(/^links\s*:\s*$/.test(line.trim())){
          inLinks = true;
          data.links = {};
          continue;
        }

        if(inLinks){
          if(!line.startsWith(" ")){
            inLinks = false;
          } else {
            const m = line.trim().match(/^([^:]+):\s*(.*)$/);
            if(m) data.links[m[1].trim()] = m[2].replace(/^["']|["']$/g,"");
            continue;
          }
        }

        const listStart = line.match(/^([A-Za-z0-9_]+):\s*$/);
        if(listStart){
          listKey = listStart[1];
          data[listKey] = [];
          continue;
        }

        if(listKey && line.trim().startsWith("-")){
          data[listKey].push(line.replace(/^\s*-\s*/,"").trim());
          continue;
        }

        const field = line.match(/^([^:]+):\s*(.*)$/);
        if(field){
          data[field[1].trim()] = field[2].replace(/^["']|["']$/g,"");
        }
      }

      if(data.artists){
        if(Array.isArray(data.artists)){
          data.artists = data.artists.map(a =>
            typeof a === "string" ? a : (a.existing || a.custom || "")
          ).filter(Boolean);
        } else {
          data.artists = [String(data.artists).trim()];
        }
      }

      return {data};
    }

    function clean(v){ return (v??"").toString().trim(); }

    function niceDate(iso){
      if(!iso) return "";
      const d = new Date(iso);
      return isNaN(d) ? iso :
        d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
    }

    const PLATFORM_DEF = [
      {key:"spotify_url", label:"Spotify", icon:"fa-brands fa-spotify", type:"icon"},
      {key:"apple_music_url", label:"Apple Music", icon:"fa-brands fa-apple", type:"icon"},
      {key:"itunes_url", label:"iTunes", img:"images/platforms/itunes.svg", type:"img"},
      {key:"tidal_url", label:"Tidal", img:"images/platforms/tidal.svg", type:"img"},
      {key:"amazon_music_url", label:"Amazon Music", icon:"fa-brands fa-amazon", type:"icon"},
      {key:"youtube_url", label:"YouTube", icon:"fa-brands fa-youtube", type:"icon"},
      {key:"traxsource_url", label:"Traxsource", img:"images/platforms/traxsource.svg", type:"img"},
      {key:"beatport_url", label:"Beatport", img:"images/platforms/beatport.svg", type:"img"},
      {key:"deezer_url", label:"Deezer", img:"images/platforms/deezer.svg", type:"img"}
    ];

    function platformButton(def, url){
      const u = clean(url);
      if(!u) return "";

      if(def.type === "img"){
        return `
          <a class="platform-btn" href="${u}" target="_blank" rel="noopener">
            <img src="${def.img}" alt="${def.label}" loading="lazy">
          </a>`;
      }

      return `
        <a class="platform-btn" href="${u}" target="_blank" rel="noopener">
          <i class="${def.icon}"></i>
        </a>`;
    }

    async function loadCard(file){
      const md = await fetch(file.download_url).then(r => r.text());
      const {data} = parseFrontmatter(md);

      const title = clean(data.title);
      const artists = (data.artists || []).join(" | ");
      const cover = clean(data.cover || data.image);
      const dateStr = clean(data.date);
      const links = data.links || {};

      const buttons = PLATFORM_DEF
        .map(def => platformButton(def, links[def.key]))
        .filter(Boolean)
        .join("");

      return {
        date: dateStr ? new Date(dateStr) : new Date(0),
        html: `
          <div class="release">
            <div class="release-content">
              <div class="release-header">
                ${artists ? `<h2 class="release-artist">${artists}</h2>` : ""}
                ${title ? `<h3 class="release-title">${title}</h3>` : ""}
              </div>

              ${cover ? `
                <img src="${cover}"
                     alt="${title}"
                     class="release-cover"
                     loading="lazy"
                     decoding="async">` : ""}

              ${buttons ? `<div class="platform-icons platforms">${buttons}</div>` : ""}

              ${dateStr ? `<p class="release-date">
                  Release date: ${niceDate(dateStr)}
                </p>` : ""}
            </div>
          </div>
        `
      };
    }

    (async()=>{
      const container = document.getElementById("releases-content");

      try{
        const files = await listFiles();
        const cards = await Promise.all(files.map(loadCard));

        cards.sort((a,b)=>b.date - a.date);

        container.innerHTML = cards.map(c => c.html).join("");

      }catch(e){
        console.error(e);
        container.innerHTML = "<p>Could not load releases.</p>";
      }
    })();

  </script>
