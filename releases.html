<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – Releases</title>

  <!-- (Valgfritt) Runtime-SEO fallback. Build-steget skriver uansett meta i <head>. -->
  <script src="js/seo.js" defer data-seo="/content/seo/releases.json"></script>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <!-- Header -->
  <script>
    fetch("header.html").then(r=>r.text()).then(html=>{
      document.body.insertAdjacentHTML("afterbegin", html);
      const btn=document.getElementById("menu-toggle"), nav=document.querySelector(".main-nav");
      if(btn&&nav){
        const t=()=>{const o=nav.classList.toggle("open");btn.textContent=o?"✖":"☰";};
        btn.addEventListener("click",t);
        document.addEventListener("click",e=>{ if(e.target.closest(".nav-links a")) {nav.classList.remove("open"); btn.textContent="☰";} });
      }
    });
  </script>

  <main>
    <div class="page-content">
      <section id="releases-header" class="fade-in">
        <h1>RELEASES</h1>
        <p>Stream or buy from your preferred platform.</p>
      </section>

      <div id="releases-content" class="releases-grid">Loading releases...</div>
    </div>
  </main>

  <footer>
    <div class="footer-logo">
      <img src="uploads/OysterdaleRecords_white_logo.png" alt="Oysterdale Records Logo" class="footer-logo-img">
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    const OWNER="Oysterdale", REPO="oysterdale-site", DIR="releases";

    async function listFiles(){
      const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`);
      if(!r.ok) throw new Error("GitHub list failed");
      return (await r.json()).filter(f=>f.type==="file" && f.name.endsWith(".md"));
    }

    function parseFrontmatter(md){
      const parts = md.split('---');
      if (parts.length < 3) return { data:{}, body: md };
      const yaml = parts[1], body = parts.slice(2).join('---').trim();
      const data = {};
      yaml.split(/\r?\n/).forEach(line=>{
        const m=line.match(/^([^:]+):\s*(.*)$/);
        if(m){
          let v = m[2].trim().replace(/^"(.*)"$/,'$1');
          data[m[1].trim()] = v;
        }
      });
      return { data, body };
    }

    function clean(v){
      return (v ?? "").toString().trim()
        .replace(/^"(.*)"$/,'$1')
        .replace(/^'(.*)'$/,'$1');
    }
    function hasValue(v){
      const s = clean(v);
      return !!s && !/^(-+|—+|none|n\/a)$/i.test(s);
    }
    function niceDate(iso){
      if(!iso) return "";
      const d=new Date(iso);
      return isNaN(d)?iso:d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
    }

    /* ---------- IKONER ---------- */
    const IMG_PLATFORMS = new Set(["deezer","tidal","beatport","traxsource","itunes"]);
    const ICONS = {
      spotify:"fa-brands fa-spotify",
      apple:"fa-brands fa-apple",
      youtube:"fa-brands fa-youtube",
      ytmusic:"fa-brands fa-youtube",
      amazon:"fa-brands fa-amazon",
      bandcamp:"fa-brands fa-bandcamp",
      soundcloud:"fa-brands fa-soundcloud",
      itunes:"", deezer:"", tidal:"", beatport:"", traxsource:""
    };

    function platformButton(key,url){
      const u = clean(url);
      if(!u) return "";
      if(IMG_PLATFORMS.has(key)){
        const file = key === "itunes" ? "itunes" : key;
        return `<a href="${u}" target="_blank" rel="noopener"><img src="images/platforms/${file}.svg" alt="${key}"></a>`;
      }
      const cls = ICONS[key];
      return cls ? `<a href="${u}" target="_blank" rel="noopener" aria-label="${key}"><i class="${cls}"></i></a>` : "";
    }

    async function loadCard(file){
      const md = await fetch(file.download_url).then(r=>r.text());
      const {data} = parseFrontmatter(md);

      const title   = clean(data.title);
      const artists = clean(data.artists || data.artist);
      const featRaw = clean(data.featured || data.feat);
      const featured = hasValue(featRaw) ? featRaw : "";

      const cover   = clean(data.cover || data.image);
      const dateStr = clean(data.date);

      const PLATFORMS = ["spotify","apple","itunes","deezer","amazon","youtube","ytmusic","tidal","beatport","traxsource","bandcamp","soundcloud"];
      const links = PLATFORMS
        .map(k => platformButton(k, data[k]))
        .filter(Boolean)
        .join("");

      const coverHref = PLATFORMS.map(k => clean(data[k])).find(Boolean) || "";

      return {
        date: dateStr ? new Date(dateStr) : new Date(0),
        html: `
          <div class="release">
            <div class="release-content">
              <div class="release-header">
                ${artists ? `<h2 class="release-artist">${artists}</h2>` : ""}
                ${title   ? `<h3 class="release-title">${title}</h3>` : ""}
                ${featured? `<p class="release-featured">feat. ${featured}</p>` : ""}
              </div>

              ${cover ? `
                ${coverHref ? `<a href="${coverHref}" target="_blank" rel="noopener">` : ``}
                  <img src="${cover}" alt="${title}" class="release-cover">
                ${coverHref ? `</a>` : ``}
              ` : ""}

              <div class="platform-icons">${links}</div>
              ${dateStr ? `<p class="release-date">Release date: ${niceDate(dateStr)}</p>` : ""}
            </div>
          </div>
        `
      };
    }

    (async ()=>{
      const container = document.getElementById("releases-content");
      try{
        const files = await listFiles();
        const cards = await Promise.all(files.map(loadCard));
        cards.sort((a,b)=>b.date - a.date);
        container.innerHTML = cards.map(c=>c.html).join("");
      }catch(e){
        console.error(e);
        container.innerHTML = "<p>Could not load releases.</p>";
      }
    })();
  </script>
</body>
</html>
