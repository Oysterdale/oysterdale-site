<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – Releases</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .releases-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .release {
      display: flex;
      flex-direction: column;
      background: #111;
      padding: 15px;
      border-radius: 8px;
      color: white;
    }
    .release-header {
      min-height: 90px; /* sørger for lik høyde for overskrifter */
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .release-artist {
      font-size: 1.1rem;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0;
    }
    .release-title {
      font-size: 1rem;
      font-weight: normal;
      text-transform: uppercase;
      margin: 5px 0 0;
    }
    .release-featured {
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .release-cover {
      width: 100%;
      margin-top: 10px;
      border-radius: 4px;
    }
    .release p {
      margin: 8px 0;
    }
    .release-body {
      margin-top: auto;
    }
  </style>
</head>
<body>

  <main class="page-content">
    <h1>Releases</h1>
    <div id="releases-content" class="releases-grid">Loading releases...</div>
  </main>

  <footer>
    <div class="footer-logo">
      <img src="uploads/OysterdaleRecords_white_logo.png" alt="Oysterdale Records Logo" class="footer-logo-img">
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    const GITHUB_OWNER = "Oysterdale";
    const GITHUB_REPO  = "oysterdale-site";
    const RELEASES_PATH = "releases";

    fetch("header.html")
      .then(res => res.text())
      .then(data => {
        document.body.insertAdjacentHTML("afterbegin", data);
        const toggleButton = document.getElementById("menu-toggle");
        const nav = document.querySelector(".main-nav");
        const navLinks = document.querySelectorAll(".main-nav a");
        if (toggleButton && nav) {
          toggleButton.addEventListener("click", () => {
            nav.classList.toggle("open");
            toggleButton.textContent = nav.classList.contains("open") ? "✖" : "☰";
          });
          navLinks.forEach(link => {
            link.addEventListener("click", () => {
              if (nav.classList.contains("open")) {
                nav.classList.remove("open");
                toggleButton.textContent = "☰";
              }
            });
          });
        }
      });

    async function getReleaseFiles() {
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${RELEASES_PATH}`;
      const res = await fetch(url, { headers: { "Accept": "application/vnd.github.v3+json" } });
      if (!res.ok) throw new Error("Kunne ikke hente releases-listen fra GitHub.");
      const entries = await res.json();
      return entries
        .filter(e => e.type === "file" && /\.md$/i.test(e.name))
        .map(e => ({ name: e.name, download_url: e.download_url }));
    }

    async function loadRelease(file) {
      const res = await fetch(file.download_url);
      const text = await res.text();
      const parts = text.split('---');
      const fm = parts.length >= 3 ? parts[1] : "";
      const bodyText = parts.length >= 3 ? parts.slice(2).join('---').trim() : "";

      const get = (key) => {
        const m = fm.match(new RegExp(`^${key}:\\s*(.+)$`, 'm'));
        return m ? m[1].trim() : "";
      };

      const artist     = get("artist");
      const title      = get("title");
      const featured   = get("featured").replace(/^"|"$/g, "").trim();
      const dateStr    = get("date");
      const cover      = get("cover");
      const spotify    = get("spotify");
      const traxsource = get("traxsource");
      const date       = dateStr ? new Date(dateStr) : new Date(0);
      const coverHref  = (spotify || traxsource) ? (spotify || traxsource) : "#";

      const html = `
        <div class="release">
          <div class="release-header">
            <h2 class="release-artist">${artist}</h2>
            <h3 class="release-title">${title}</h3>
            ${featured ? `<p class="release-featured">feat. ${featured}</p>` : ""}
          </div>
          ${cover ? `<a href="${coverHref}" target="_blank"><img src="${cover}" alt="${title}" class="release-cover"></a>` : ""}
          <p>
            ${spotify ? `<a href="${spotify}" target="_blank">Spotify</a>` : ""}
            ${traxsource ? `${spotify ? " | " : ""}<a href="${traxsource}" target="_blank">Traxsource</a>` : ""}
          </p>
          <p>Release date: ${dateStr}</p>
          <div class="release-body">${marked.parse(bodyText)}</div>
        </div>
      `;
      return { html, date };
    }

    async function loadAllReleases() {
      const container = document.getElementById("releases-content");
      container.innerHTML = "";
      try {
        const files = await getReleaseFiles();
        const releases = await Promise.all(files.map(loadRelease));
        releases.sort((a, b) => b.date - a.date);
        releases.forEach(r => container.insertAdjacentHTML("beforeend", r.html));
      } catch (err) {
        container.innerHTML = `<p>Kunne ikke laste releases akkurat nå.</p>`;
        console.error(err);
      }
    }
    loadAllReleases();
  </script>
</body>
</html>
