<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – Releases</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Header -->
  <div id="main-header"></div>

  <main class="page-content">
    <h1>Releases</h1>
    <div id="releases-content">Loading releases...</div>
  </main>

  <footer>
    &copy; 2025 Oysterdale Records. All rights reserved.
  </footer>

  <script>
    // Importer header
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('main-header').innerHTML = html;
        const toggleButton = document.getElementById('menu-toggle');
        const nav = document.querySelector('.main-nav');
        const navLinks = document.querySelectorAll('.main-nav a');

        if (toggleButton && nav) {
          toggleButton.addEventListener('click', () => {
            nav.classList.toggle('open');
            toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
          });

          navLinks.forEach(link => {
            link.addEventListener('click', () => {
              if (nav.classList.contains('open')) {
                nav.classList.remove('open');
                toggleButton.textContent = '☰';
              }
            });
          });
        }
      });

    // Hent én release
    async function loadRelease(file) {
      const res = await fetch(`/releases/${file}`);
      const text = await res.text();

      const artistMatch = text.match(/artist:\s*(.+)/);
      const titleMatch = text.match(/title:\s*(.+)/);
      const dateMatch = text.match(/date:\s*(.+)/);
      const coverMatch = text.match(/cover:\s*(.+)/);
      const spotifyMatch = text.match(/spotify:\s*(.+)/);
      const traxsourceMatch = text.match(/traxsource:\s*(.+)/);
      const bodyText = text.split('---').pop().trim();

      return {
        file,
        html: `
          <div class="release">
            <h2>${artistMatch ? artistMatch[1] : ''}</h2>
            <h3>${titleMatch ? titleMatch[1] : 'Untitled'}</h3>
            ${coverMatch ? `<a href="${spotifyMatch || traxsourceMatch || '#'}" target="_blank"><img src="${coverMatch[1]}" alt="${titleMatch ? titleMatch[1] : ''}" class="release-cover"></a>` : ''}
            <p>
              ${spotifyMatch ? `<a href="${spotifyMatch[1]}" target="_blank">Spotify</a>` : ''}
              ${traxsourceMatch ? `${spotifyMatch ? ' | ' : ''}<a href="${traxsourceMatch[1]}" target="_blank">Traxsource</a>` : ''}
            </p>
            <div class="release-body">${marked.parse(bodyText)}</div>
          </div>
        `,
        date: dateMatch ? new Date(dateMatch[1]) : new Date(0) // fallback til eldste dato
      };
    }

    // Hent alle release-filer fra GitHub via et JSON-endepunkt (må manuelt oppdateres)
    const releaseFiles = [
      "get-on-up-feat-emél.md",
      "okplus-dancing-on-the-clouds-feat-rona-ray.md"
      // legg til flere her
    ];

    async function loadAllReleases() {
      const container = document.getElementById('releases-content');
      container.innerHTML = '';

      const releasePromises = releaseFiles.map(loadRelease);
      const releases = await Promise.all(releasePromises);

      // sorter etter dato (nyeste først)
      releases.sort((a, b) => b.date - a.date);

      for (const release of releases) {
        container.innerHTML += release.html;
      }
    }

    loadAllReleases();
  </script>
</body>
</html>
