  <!-- Lokal styling for artist-kort -->
  <style>
    .page-content { padding-top: 90px; }
    .section { margin: 30px 0 50px; }
    .section h2 { margin: 0 0 16px; }
    .artists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      align-items: stretch;
    }
    .artist-card {
      background: #111;
      color: #fff;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      height: 100%;
    }
    .artist-media {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      background: #222;
    }
    .artist-name {
      margin: 12px 0 6px;
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .02em;
    }
    .artist-bio {
      font-size: 0.95rem;
      line-height: 1.5;
      opacity: 0.95;
      margin: 4px 0 10px;
    }
    .artist-links {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      opacity: 0.95;
    }
    .artist-links a {
      text-decoration: none;
      color: #fff;
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.82rem;
      transition: transform .07s ease;
    }
    .artist-links a:hover { transform: translateY(-1px); }
    .muted { opacity: 0.7; }
  </style>
</head>
<body>

  <!-- Header -->
  <script>
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.body.insertAdjacentHTML('afterbegin', html);
        const toggleButton = document.getElementById('menu-toggle');
        const nav = document.querySelector('.main-nav');
        const navLinks = document.querySelectorAll('.main-nav a');
        if (toggleButton && nav) {
          toggleButton.addEventListener('click', () => {
            nav.classList.toggle('open');
            toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
          });
          navLinks.forEach(link => {
            link.addEventListener('click', () => {
              if (nav.classList.contains('open')) {
                nav.classList.remove('open');
                toggleButton.textContent = '☰';
              }
            });
          });
        }
      });
  </script>

  <!-- Structured data (JSON-LD) -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const domain = "https://oysterdalerecords.com";
    const artists = document.querySelectorAll(".artist-card");
    const items = [];
    artists.forEach(a => {
      const name  = a.querySelector(".artist-name")?.textContent?.trim();
      const img   = a.querySelector(".artist-media")?.getAttribute("src");
      const bio   = a.querySelector(".artist-bio")?.textContent?.trim();
      const url   = domain + "/artists";
      const links = Array.from(a.querySelectorAll(".artist-links a")).map(l => l.href);
      if (name) {
        const obj = {
          "@type": "MusicGroup",
          "name": name,
          "url": url
        };
        if (img) obj.image = img;
        if (bio) obj.description = bio;
        if (links.length) obj.sameAs = links;
        items.push(obj);
      }
    });
