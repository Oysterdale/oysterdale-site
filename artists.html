<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – Artists</title>

  <!-- Anti-FOUC -->
  <style>body{opacity:0; transition:opacity .18s ease}</style>

  <link rel="stylesheet" href="styles.css" />
  <script src="js/seo.js" defer data-seo="/content/seo/artists.json"></script>

  <!-- Font Awesome -->
  <link rel="preload"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        as="style" crossorigin
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          crossorigin>
  </noscript>

  <link rel="icon" href="images/favicon.png" type="image/png" />

  <script>
    window.addEventListener('load', () => { document.body.style.opacity = 1; });
  </script>
</head>
<body>
  <!-- Header -->
  <script>
    fetch('header.html').then(r=>r.text()).then(html=>{
      document.body.insertAdjacentHTML('afterbegin', html);
      const btn=document.getElementById('menu-toggle'), nav=document.querySelector('.main-nav');
      if(btn&&nav){
        const t=()=>{const o=nav.classList.toggle('open'); btn.textContent=o?'✖':'☰';};
        btn.addEventListener('click',t);
        document.addEventListener('click',e=>{
          if(e.target.closest('.nav-links a')){
            nav.classList.remove('open'); btn.textContent='☰';
          }
        });
      }
    });
  </script>

  <main class="page-content">
    <h1>Artists</h1>

    <section style="margin:30px 0 10px;">
      <h2>PRODUCERS</h2>
    </section>
    <div class="releases-grid" id="producers"></div>

    <section style="margin:40px 0 10px;">
      <h2>VOCALISTS</h2>
    </section>
    <div class="releases-grid" id="vocalists"></div>
  </main>

  <!-- Footer -->
  <script>
  (async function loadFooter(){
    try{
      const r = await fetch('/content/settings/footer.json', {cache:'no-store'});
      const cfg = await r.json();

      const w = Number(cfg.width) || 260;
      const logoSrc = cfg.logo
        ? `/.netlify/images?url=${encodeURIComponent(cfg.logo)}&w=${w}&h=${w}&fit=contain&fm=webp&q=80`
        : '/uploads/OysterdaleRecords_white_logo_260.webp';

      const linksHtml = (cfg.links && cfg.links.length)
        ? `<nav class="footer-nav">${cfg.links.map(l => `<a href="${l.href}">${l.label}</a>`).join(" | ")}</nav>`
        : "";

      const html = `
        <footer>
          <div class="footer-logo">
            <img src="${logoSrc}" alt="Oysterdale Records Logo"
                 class="footer-logo-img"
                 width="${w}" height="${w}"
                 loading="lazy" decoding="async">
          </div>
          <p>${cfg.text || '© 2025 Oysterdale Records. All rights reserved.'}</p>
          ${linksHtml}
        </footer>`;
      document.body.insertAdjacentHTML('beforeend', html);
    }catch(e){ console.error('Footer load failed', e); }
  })();
  </script>

  <!-- Artists script -->
  <script>
    const OWNER="Oysterdale", REPO="oysterdale-site", DIR="artists";
    function ni(url, w){ return `/.netlify/images?url=${encodeURIComponent(url)}&w=${w}&fm=webp&q=74`; }

    async function listFiles(){
      const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`);
      if(!r.ok) throw new Error("GitHub list failed");
      return (await r.json()).filter(f=>f.name.endsWith(".md"));
    }

    function slugify(str){
      return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    }

    function parseFrontmatter(md){
      const parts=md.split('---');
      if(parts.length<3) return {data:{}, body:md};
      const yaml=parts[1], body=parts.slice(2).join('---').trim();
      const data={};
      yaml.split(/\r?\n/).forEach(line=>{
        const m=line.match(/^([^:]+):\s*(.*)$/);
        if(m){
          let v=m[2].trim().replace(/^"(.*)"$/,'$1');
          data[m[1].trim()]=v;
        }
      });
      return {data, body};
    }

    function imgTag(src, alt){
      if(!src) return "";
      const w200 = ni(src,200), w320 = ni(src,320), w400 = ni(src,400), w600 = ni(src,600);
      return `
        <div class="thumb">
          <img src="${w400}"
               srcset="${w200} 200w, ${w320} 320w, ${w400} 400w, ${w600} 600w"
               sizes="(max-width: 768px) 90vw, 400px"
               alt="${alt ? alt.replace(/"/g,'&quot;') : ''}"
               loading="lazy" decoding="async">
        </div>`;
    }

    function card(a){
      const name=a.name||a.title||"";
      const img=a.image||a.photo||"";
      const slug=slugify(name);
      const localLink=`/artists/${slug}.html`; // fremtidig individuell side
      const external=a.website||a.spotify||a.instagram||"";
      const link=external || localLink;

      return `
        <div class="artist">
          ${imgTag(img, name)}
          <h3>${name}</h3>
          ${link ? `<p style="margin-top:8px;"><a class="btn" href="${link}" target="_blank" rel="noopener">More</a></p>` : ""}
        </div>`;
    }

    (async ()=>{
      try{
        const files=await listFiles();
        const items=await Promise.all(files.map(async f=>{
          const md=await fetch(f.download_url).then(r=>r.text());
          const {data}=parseFrontmatter(md);
          return data;
        }));
        const producers = items.filter(a => /producer/i.test(a.role||""));
        const vocalists = items.filter(a => /vocal/i.test(a.role||""));
        document.getElementById('producers').innerHTML = producers.map(card).join('');
        document.getElementById('vocalists').innerHTML = vocalists.map(card).join('');
      }catch(e){ console.error(e); }
    })();
  </script>
</body>
</html>
