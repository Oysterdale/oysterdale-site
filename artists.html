<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – Artists</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Lokal styling for artist-kort som matcher releases -->
  <style>
    .page-content { padding-top: 90px; }

    .section { margin: 30px 0 50px; }
    .section h2 { margin: 0 0 16px; }

    .artists-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 700px) {
      .artists-grid { grid-template-columns: 1fr; }
    }

    .artist-card {
      background: #111;
      color: #fff;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      height: 100%;
    }
    .artist-media {
      width: 100%;
      aspect-ratio: 1 / 1;       /* kvadrat */
      object-fit: cover;         /* cropper pent */
      border-radius: 10px;
      background: #222;
    }
    .artist-name {
      margin: 12px 0 6px;
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .02em;
    }
    .artist-bio {
      font-size: 0.95rem;
      line-height: 1.5;
      opacity: 0.95;
      margin: 4px 0 10px;
    }
    .artist-links {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-top: auto;          /* knapper ned mot bunnen */
      justify-content: center;
    }
    .artist-links a {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 999px;
      background: rgba(255,255,255,.06);
      transition: transform .12s ease, background .12s ease, opacity .12s ease;
      line-height: 0; color: #fff;
    }
    .artist-links a:hover { transform: translateY(-1px); }
    .muted { opacity: 0.7; }
  </style>
</head>
<body>

  <!-- Last samme header/meny som øvrige sider -->
  <script>
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.body.insertAdjacentHTML('afterbegin', html);

        const toggleButton = document.getElementById('menu-toggle');
        const nav = document.querySelector('.main-nav');
        const navLinks = document.querySelectorAll('.main-nav a');

        if (toggleButton && nav) {
          toggleButton.addEventListener('click', () => {
            nav.classList.toggle('open');
            toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
          });
          navLinks.forEach(link => {
            link.addEventListener('click', () => {
              if (nav.classList.contains('open')) {
                nav.classList.remove('open');
                toggleButton.textContent = '☰';
              }
            });
          });
        }
      });
  </script>

  <main class="page-content">
    <section class="section">
      <h2>PRODUCERS</h2>
      <div id="producers" class="artists-grid"></div>
      <p id="producers-empty" class="muted" style="display:none;">No producers yet.</p>
    </section>

    <section class="section">
      <h2>VOCALISTS</h2>
      <div id="vocalists" class="artists-grid"></div>
      <p id="vocalists-empty" class="muted" style="display:none;">No vocalists yet.</p>
    </section>
  </main>

  <footer>
    <div class="footer-logo">
      <img src="uploads/OysterdaleRecords_white_logo.png" alt="Oysterdale Records Logo" class="footer-logo-img">
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    const OWNER   = "Oysterdale";
    const REPO    = "oysterdale-site";
    const SUBPATH = "artists";

    function parseFrontmatter(md) {
      const parts = md.split('---');
      if (parts.length < 3) return { body: md, data: {} };
      const yaml = parts[1];
      const body = parts.slice(2).join('---').trim();
      const data = {};
      yaml.split(/\r?\n/).forEach(line => {
        const m = line.match(/^(\w+):\s*(.*)$/);
        if (m) {
          let v = m[2].trim().replace(/^"(.*)"$/, '$1');
          data[m[1].trim()] = v;
        }
      });
      return { body, data };
    }

    async function fetchArtists() {
      const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${SUBPATH}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Could not fetch artist files");
      const files = await res.json();

      const mdFiles = files.filter(f => f.name.endsWith(".md"));

      const artists = [];
      for (const f of mdFiles) {
        const raw = await fetch(f.download_url).then(r => r.text());
        const { data, body } = parseFrontmatter(raw);
        artists.push({
          name: data.name || data.title || "",
          role: data.role || "",
          image: data.image || data.photo || "",
          url: data.url || data.link || "",
          bio: body || ""
        });
      }

      const producers = artists.filter(a => /producer/i.test(a.role));
      const vocalists = artists.filter(a => /vocal/i.test(a.role));
      return { producers, vocalists };
    }

    function renderArtists(list, container, emptyEl) {
      if (!list || !list.length) {
        emptyEl && (emptyEl.style.display = "");
        return;
      }
      emptyEl && (emptyEl.style.display = "none");

      const html = list.map(a => `
        <article class="artist-card">
          ${a.image ? `<img class="artist-media" src="${a.image}" alt="${a.name}">` : ""}
          <h3 class="artist-name">${a.name}</h3>
          ${a.role ? `<p class="muted">${a.role}</p>` : ""}
          ${a.bio ? `<div class="artist-bio">${marked.parse(a.bio)}</div>` : ""}
          <div class="artist-links">
            ${a.url ? `<a href="${a.url}" target="_blank" rel="noopener" aria-label="Website"><i class="fa-solid fa-link"></i></a>` : ""}
          </div>
        </article>
      `).join("");

      container.innerHTML = html;

      // Utjevn kort-høyder på desktop, for pen grid
      const grids = [document.getElementById('producers'), document.getElementById('vocalists')];
      const wide = window.innerWidth >= 700;
      grids.forEach(grid => {
        if (!grid) return;
        const cards = Array.from(grid.querySelectorAll('.artist-card'));
        cards.forEach(c => c.style.minHeight = ''); // reset
        if (!wide || cards.length === 0) return;   // ikke lås høyde på mobil
        const maxH = Math.max(...cards.map(c => c.getBoundingClientRect().height));
        cards.forEach(c => c.style.minHeight = `${Math.ceil(maxH)}px`);
      });
    }

    // Debounce for resize
    let _t;
    window.addEventListener('resize', () => {
      clearTimeout(_t);
      _t = setTimeout(equalizeCardHeights, 120);
    });

    (async function init() {
      const { producers, vocalists } = await fetchArtists();
      renderArtists(producers, document.getElementById("producers"), document.getElementById("producers-empty"));
      renderArtists(vocalists, document.getElementById("vocalists"), document.getElementById("vocalists-empty"));
      // Når alt er i DOM, utjevn høyder
      requestAnimationFrame(equalizeCardHeights);
    })();
  </script>
</body>
</html>
