<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artists — Oysterdale Records</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page-content">
    <h1>Artists</h1>
    <div class="releases-grid" id="artistsGrid"></div>
  </main>

  <footer>
    <div class="footer-logo"><img class="footer-logo-img" src="uploads/OysterdaleRecords_white_logo.png" alt=""></div>
    <p>&copy; <span id="year"></span> Oysterdale Records</p>
  </footer>

  <script>
    fetch("header.html").then(r=>r.text()).then(html=>{
      document.getElementById("site-header").innerHTML = html;
      const btn=document.querySelector(".menu-toggle"), nav=document.querySelector(".main-nav");
      if(btn&&nav){
        const t=()=>{const o=nav.classList.toggle("open");btn.setAttribute("aria-expanded",String(o));};
        btn.addEventListener("click",t);
        document.addEventListener("click",e=>{if(e.target.closest(".nav-links a")) nav.classList.remove("open");});
        document.addEventListener("keydown",e=>{if(e.key==="Escape") nav.classList.remove("open");});
      }
    });
    document.getElementById("year").textContent=new Date().getFullYear();

    const GH_OWNER="Oysterdale", GH_REPO="oysterdale-site", DIR="artists";
    async function listFiles(){
      const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${DIR}`);
      if(!r.ok) throw new Error("GitHub list failed");
      return (await r.json()).filter(x=>x.type==="file" && x.name.endsWith(".md"));
    }
    function parseFM(md){
      const m=md.match(/^---\n([\s\S]*?)\n---/); const fm={};
      if(m){ m[1].split(/\n/).forEach(l=>{ const i=l.indexOf(":"); if(i>-1){ const k=l.slice(0,i).trim(); let v=l.slice(i+1).trim(); fm[k]=v.replace(/^"(.*)"$/,"$1"); } }); }
      return fm;
    }
    function card(a){
      const name=a.name||"", role=a.role||"", img=a.image||a.photo||"images/placeholder-artist.png", link=a.url||a.link||"";
      return `
        <article class="artist">
          <img class="artist-photo" src="${img}" alt="${name}">
          <h3>${name}</h3>
          ${role?`<p style="color:#ccc">${role}</p>`:""}
          ${link?`<p><a class="btn" target="_blank" rel="noopener" href="${link}">More</a></p>`:""}
        </article>
      `;
    }
    (async ()=>{
      try{
        const files=await listFiles();
        const items=await Promise.all(files.map(async f=>{
          const raw=f.download_url || `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/${DIR}/${f.name}`;
          const md=await fetch(raw).then(r=>r.text());
          return parseFM(md);
        }));
        document.getElementById("artistsGrid").innerHTML = items.map(card).join("");
      }catch(e){ console.error(e); document.getElementById("artistsGrid").innerHTML = "<p>Could not load artists.</p>"; }
    })();
  </script>
</body>
</html>
