<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – Artists</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .section { margin: 30px 0 50px; }
    .section h2 { margin: 0 0 16px; }

    .artists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .artist-card {
      background: #111;
      color: #fff;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }
    .artist-media {
      width: 100%;
      max-height: 280px; /* begrenser høyden */
      object-fit: cover;
      border-radius: 10px;
      background: #222;
    }
    .artist-name {
      margin: 12px 0 6px;
      font-size: 1.15rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .02em;
    }
    .artist-bio {
      font-size: 0.95rem;
      line-height: 1.5;
      opacity: 0.95;
      margin: 6px 0 10px;
      min-height: 0; /* fjernet tvungen høyde */
    }
    .artist-links {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      opacity: 0.95;
    }
    .artist-links a {
      text-decoration: none;
      color: #fff;
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.85rem;
      transition: transform .07s ease;
    }
    .artist-links a:hover { transform: translateY(-1px); }
    .muted { opacity: 0.7; }
    .page-content { padding-top: 90px; }
  </style>
</head>
<body>

  <script>
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.body.insertAdjacentHTML('afterbegin', html);

        const toggleButton = document.getElementById('menu-toggle');
        const nav = document.querySelector('.main-nav');
        const navLinks = document.querySelectorAll('.main-nav a');

        if (toggleButton && nav) {
          toggleButton.addEventListener('click', () => {
            nav.classList.toggle('open');
            toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
          });
          navLinks.forEach(link => {
            link.addEventListener('click', () => {
              if (nav.classList.contains('open')) {
                nav.classList.remove('open');
                toggleButton.textContent = '☰';
              }
            });
          });
        }
      });
  </script>

  <main class="page-content">
    <h1>ARTISTS</h1>

    <section class="section">
      <h2>PRODUCERS</h2>
      <div id="producers" class="artists-grid"></div>
      <p id="producers-empty" class="muted" style="display:none;">No producers yet.</p>
    </section>

    <section class="section">
      <h2>VOCALISTS</h2>
      <div id="vocalists" class="artists-grid"></div>
      <p id="vocalists-empty" class="muted" style="display:none;">No vocalists yet.</p>
    </section>
  </main>

  <footer>
    <div class="footer-logo">
      <img src="uploads/OysterdaleRecords_white_logo.png" alt="Oysterdale Records Logo" class="footer-logo-img">
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    const GITHUB_OWNER = "Oysterdale";
    const GITHUB_REPO  = "oysterdale-site";
    const ARTISTS_PATH = "artists";

    async function fetchArtists() {
      const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${ARTISTS_PATH}`;
      const res = await fetch(apiUrl, { headers: { "Accept": "application/vnd.github.v3+json" } });
      if (!res.ok) return { producers: [], vocalists: [] };

      const files = await res.json();
      const mdFiles = files.filter(f => f.type === "file" && /\.md$/i.test(f.name));

      const artists = [];
      for (const file of mdFiles) {
        const raw = await fetch(file.download_url).then(r => r.text());
        const fmMatch = raw.match(/---([\s\S]*?)---/);
        if (!fmMatch) continue;

        const fmBlock = fmMatch[1];
        const get = (key) => {
          const m = fmBlock.match(new RegExp(`^${key}:\\s*(.+)$`, 'm'));
          return m ? m[1].trim().replace(/^"|"$/g, '') : "";
        };

        artists.push({
          name: get("name"),
          role: (get("role") || "").toLowerCase(),
          image: get("image"),
          bio: get("bio"), // ikke required
          spotify: get("spotify"),
          soundcloud: get("soundcloud"),
          instagram: get("instagram"),
          website: get("website"),
          mixcloud: get("mixcloud"),
          bandcamp: get("bandcamp"),
        });
      }

      const producers = artists
        .filter(a => a.role === "producer" || a.role === "main")
        .sort((a,b) => a.name.localeCompare(b.name, undefined, {sensitivity: "base"}));

      const vocalists = artists
        .filter(a => a.role === "vocalist")
        .sort((a,b) => a.name.localeCompare(b.name, undefined, {sensitivity: "base"}));

      return { producers, vocalists };
    }

    function renderArtists(list, container, emptyMsg) {
      if (!list.length) {
        emptyMsg.style.display = "block";
        return;
      }
      const frag = document.createDocumentFragment();
      list.forEach(a => {
        const card = document.createElement("div");
        card.className = "artist-card";
        card.innerHTML = `
          ${a.image ? `<img class="artist-media" src="${a.image}" alt="${a.name}">` : ""}
          <div class="artist-name">${a.name || ""}</div>
          ${a.bio ? `<div class="artist-bio">${a.bio}</div>` : ""}
          <div class="artist-links">
            ${a.spotify ? `<a href="${a.spotify}" target="_blank"><i class="fab fa-spotify"></i> Spotify</a>` : ""}
            ${a.soundcloud ? `<a href="${a.soundcloud}" target="_blank"><i class="fab fa-soundcloud"></i> SoundCloud</a>` : ""}
            ${a.instagram ? `<a href="${a.instagram}" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>` : ""}
            ${a.website ? `<a href="${a.website}" target="_blank"><i class="fas fa-globe"></i> Website</a>` : ""}
            ${a.mixcloud ? `<a href="${a.mixcloud}" target="_blank"><i class="fab fa-mixcloud"></i> Mixcloud</a>` : ""}
            ${a.bandcamp ? `<a href="${a.bandcamp}" target="_blank"><i class="fab fa-bandcamp"></i> Bandcamp</a>` : ""}
          </div>
        `;
        frag.appendChild(card);
      });
      container.appendChild(frag);
    }

    (async function init() {
      const { producers, vocalists } = await fetchArtists();
      renderArtists(producers, document.getElementById("producers"), document.getElementById("producers-empty"));
      renderArtists(vocalists, document.getElementById("vocalists"), document.getElementById("vocalists-empty"));
    })();
  </script>
</body>
</html>
