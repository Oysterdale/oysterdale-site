  <!-- FOOTER -->
  <script>
    (async function loadFooter(){
      function normalize(src){
        if(!src) return "";
        if(/^https?:\/\//.test(src)) return src;
        return src.startsWith("/") ? src : "/" + src;
      }
      try{
        const res = await fetch("/content/settings/footer.json",{cache:"no-store"});
        const cfg = await res.json();
        const w = Number(cfg.width) || 260;
        const logoPath = normalize(cfg.logo || "/uploads/OysterdaleRecords_white_logo_260.webp");
        const logo = `/.netlify/images?url=${encodeURIComponent(logoPath)}&w=${w}&h=${w}&fit=contain&fm=webp&q=80`;

        const linksHtml = (cfg.links && cfg.links.length)
          ? `<nav class="footer-nav">${cfg.links.map(l => `<a href="${l.href}">${l.label}</a>`).join(" | ")}</nav>`
          : "";

        const html = `
          <footer>
            <div class="footer-logo">
              <a href="/" aria-label="Home">
                <img src="${logo}" width="${w}" height="${w}" alt="Oysterdale Records Logo"
                     class="footer-logo-img" loading="lazy" decoding="async">
              </a>
            </div>
            <p>${cfg.text || '© 2026 Oysterdale Records. All rights reserved.'}</p>
            ${linksHtml}
          </footer>`;
        document.body.insertAdjacentHTML("beforeend",html);
      }catch(e){console.error(e);}
    })();
  </script>


  <!-- ARTISTS SCRIPT -->
  <script>
    const OWNER="Oysterdale", REPO="oysterdale-site", DIR="artists";

    function normalize(src){
      if(!src) return "";
      if(/^https?:\/\//.test(src)) return src;
      return src.startsWith("/") ? src : "/" + src;
    }

    // Netlify Image CDN wrapper
    function ni(url,w){
      const u = normalize(url);
      return `/.netlify/images?url=${encodeURIComponent(u)}&w=${w}&fm=webp&q=74`;
    }

    async function listFiles(){
      const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`);
      if(!r.ok) throw new Error("GitHub list failed");
      return (await r.json()).filter(f=>f.name.endsWith(".md"));
    }

    function parseFrontmatter(md){
      const parts=md.split('---');
      if(parts.length<3) return {data:{}};
      const yaml=parts[1];
      const data={};
      yaml.split(/\r?\n/).forEach(line=>{
        const m=line.match(/^([^:]+):\s*(.*)$/);
        if(m){
          data[m[1].trim()] = m[2].trim().replace(/^"(.*)"$/,"$1");
        }
      });
      return {data};
    }

    function imgTag(src, alt, link){
      if(!src) return "";
      const u = normalize(src);

      const w200 = ni(u,200);
      const w320 = ni(u,320);
      const w400 = ni(u,400);
      const w600 = ni(u,600);

      const img = `
        <img src="${w400}"
             srcset="${w200} 200w, ${w320} 320w, ${w400} 400w, ${w600} 600w"
             sizes="(max-width:700px) 90vw, 400px"
             alt="${alt ? alt.replace(/"/g,"&quot;") : ""}"
             loading="lazy" decoding="async">
      `;

      return `
        <div class="thumb">
          ${img}
        </div>
      `;
    }

    function card(a){
      const name = a.name || a.title || "";
      const img  = a.image || a.photo || "";
      const role = a.role || "";

      const artistSlug = a.name.toLowerCase().replace(/\s+/g, '-');
      return `
        <div class="artist">
          <a href="/artists/${artistSlug}/" class="artist-link">
            ${imgTag(img, name)}
            <h3>${name}</h3>
            ${role ? `<p style="margin:4px 0 0;font-size:13px;opacity:.55;text-transform:capitalize;">${role}</p>` : ""}
          </a>
        </div>
      `;
    }

    (async()=>{
      try{
        const files = await listFiles();
        const items = await Promise.all(files.map(async f=>{
          const md = await fetch(f.download_url).then(r=>r.text());
          return parseFrontmatter(md).data;
        }));

        const family = items.filter(a => /signed/i.test(a.status || ""));
        const collaborators = items.filter(a => !/signed/i.test(a.status || ""));

        document.getElementById("family").innerHTML =
          family.map(card).join("") || '<p style="opacity:.6;margin-left:8px;">No roster artists yet. Edit an artist .md file and set status: signed</p>';

        document.getElementById("collaborators").innerHTML =
          collaborators.map(card).join("") || '<p style="opacity:.6;margin-left:8px;">No collaborators yet.</p>';

      }catch(e){console.error(e);}
    })();
  </script>
