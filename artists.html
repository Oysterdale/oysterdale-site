<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – Artists</title>

  <!-- SEO loader: henter data fra JSON og setter KUN meta-tags i <head> -->
  <script src="js/seo.js" defer data-seo="/content/seo/artists.json"></script>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <!-- Header -->
  <script>
    fetch('header.html').then(r=>r.text()).then(html=>{
      document.body.insertAdjacentHTML('afterbegin', html);
      const btn=document.getElementById('menu-toggle'), nav=document.querySelector('.main-nav');
      const navLinks=document.querySelectorAll('.main-nav a');
      if(btn&&nav){
        const toggle=()=>{ const o=nav.classList.toggle('open'); btn.textContent=o?'✖':'☰'; };
        btn.addEventListener('click',toggle);
        navLinks.forEach(a=>a.addEventListener('click',()=>{ if(nav.classList.contains('open')){ nav.classList.remove('open'); btn.textContent='☰'; } }));
      }
    });
  </script>

  <main class="page-content">
    <h1>Artists</h1>

    <section style="margin:30px 0 10px;">
      <h2>PRODUCERS</h2>
    </section>
    <div class="releases-grid" id="producers"></div>

    <section style="margin:40px 0 10px;">
      <h2>VOCALISTS</h2>
    </section>
    <div class="releases-grid" id="vocalists"></div>
  </main>

  <footer>
    <div class="footer-logo">
      <img src="uploads/OysterdaleRecords_white_logo.png" alt="Oysterdale Records Logo" class="footer-logo-img">
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    const OWNER="Oysterdale", REPO="oysterdale-site", DIR="artists";

    async function listFiles(){
      const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`);
      if(!r.ok) throw new Error("GitHub list failed");
      return (await r.json()).filter(f=>f.type==="file" && f.name.endsWith(".md"));
    }

    function parseFrontmatter(md){
      const parts=md.split('---');
      if(parts.length<3) return {data:{}, body:md};
      const yaml=parts[1], body=parts.slice(2).join('---').trim();
      const data={};
      yaml.split(/\r?\n/).forEach(line=>{
        const m=line.match(/^([^:]+):\s*(.*)$/);
        if(m){
          let v=m[2].trim().replace(/^"(.*)"$/,'$1');
          data[m[1].trim()]=v;
        }
      });
      return {data, body};
    }

    function clean(v){ return (v ?? "").toString().trim().replace(/^"(.*)"$/,'$1').replace(/^'(.*)'$/,'$1'); }
    function has(v){ const s=clean(v); return !!s && !/^(-+|—+|none|n\/a)$/i.test(s); }

    function card(a){
      const name = clean(a.name || a.title || "");
      const role = clean(a.role || "");
      const img  = clean(a.image || a.photo || "");
      const url  = clean(a.website || a.url || a.link || "");
      const socials = {
        spotify: clean(a.spotify),
        soundcloud: clean(a.soundcloud),
        instagram: clean(a.instagram),
        bandcamp: clean(a.bandcamp),
        mixcloud: clean(a.mixcloud)
      };

      const socialHtml = Object.entries(socials)
        .filter(([,u])=>has(u))
        .map(([k,u])=>{
          const cls = {
            spotify:"fa-brands fa-spotify",
            soundcloud:"fa-brands fa-soundcloud",
            instagram:"fa-brands fa-instagram",
            bandcamp:"fa-brands fa-bandcamp",
            mixcloud:"fa-brands fa-mixcloud"
          }[k] || "fa-solid fa-link";
          return `<a href="${u}" target="_blank" rel="noopener" aria-label="${k}"><i class="${cls}"></i></a>`;
        }).join('');

      return `
        <div class="artist">
          ${img ? `<img class="artist-photo" src="${img}" alt="${name}">` : ""}
          <h3>${name}</h3>
          ${has(role) ? `<p class="artist-role">${role}</p>` : ""}
          <div class="artist-links">
            ${has(url) ? `<a class="btn" href="${url}" target="_blank" rel="noopener">Website</a>` : ""}
            ${socialHtml}
          </div>
        </div>
      `;
    }

    (async ()=>{
      try{
        const files=await listFiles();
        const items=await Promise.all(files.map(async f=>{
          const md=await fetch(f.download_url).then(r=>r.text());
          const {data}=parseFrontmatter(md);
          return data;
        }));

        const producers = items.filter(a => /producer/i.test(a.role||""));
        const vocalists = items.filter(a => /vocal/i.test(a.role||""));

        document.getElementById('producers').innerHTML = producers.map(card).join('');
        document.getElementById('vocalists').innerHTML = vocalists.map(card).join('');
      }catch(e){
        console.error(e);
        document.getElementById('producers').innerHTML = '<p>Could not load artists.</p>';
        document.getElementById('vocalists').innerHTML = '';
      }
    })();
  </script>
</body>
</html>
