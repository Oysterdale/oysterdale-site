<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – Artists</title>

  <!-- SEO runtime (fallback) -->
  <script src="js/seo.js" defer data-seo="/content/seo/artists.json"></script>

  <!-- Preconnects -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://api.github.com" crossorigin>

  <!-- CSS: preload + non-blocking -->
  <link rel="preload" href="styles.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="styles.css"></noscript>

  <!-- Font Awesome: non-blocking -->
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" crossorigin
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin>
  </noscript>

  <link rel="icon" href="images/favicon.png" type="image/png" />

  <!-- Spesifikk styling for artist-bilder -->
  <style>
    .artist-photo {
      width: 240px;
      height: 240px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }
    .artist {
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Header (henter felles header med a11y-fikser) -->
  <script>
    fetch('header.html').then(r=>r.text()).then(html=>{
      document.body.insertAdjacentHTML('afterbegin', html);
      const btn=document.getElementById('menu-toggle'), nav=document.querySelector('.main-nav');
      if(btn&&nav){
        const t=()=>{const o=nav.classList.toggle('open'); btn.textContent=o?'✖':'☰';};
        btn.addEventListener('click',t);
        document.addEventListener('click',e=>{ if(e.target.closest('.nav-links a')) {nav.classList.remove('open'); btn.textContent='☰';} });
      }
    });
  </script>

  <main class="page-content">
    <h1>Artists</h1>

    <section style="margin:30px 0 10px;">
      <h2>PRODUCERS</h2>
    </section>
    <div class="releases-grid" id="producers"></div>

    <section style="margin:40px 0 10px;">
      <h2>VOCALISTS</h2>
    </section>
    <div class="releases-grid" id="vocalists"></div>
  </main>

  <footer>
    <div class="footer-logo">
      <img
        src="/.netlify/images?url=/uploads/OysterdaleRecords_white_logo.png&w=260&h=260&fit=contain&fm=webp&q=74"
        alt="Oysterdale Records Logo"
        class="footer-logo-img"
        width="260" height="260"
        loading="lazy"
        decoding="async"
      >
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    const OWNER="Oysterdale", REPO="oysterdale-site", DIR="artists";

    // Bygg Netlify Image URL for responsive bilder
    function ni(url, w){
      const u = encodeURIComponent(url);
      return `/.netlify/images?url=${u}&w=${w}&fm=webp&q=74&fit=cover`;
    }

    function listFiles(){
      return fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`)
        .then(r=>{ if(!r.ok) throw new Error("GitHub list failed"); return r.json(); })
        .then(arr=>arr.filter(f=>f.name.endsWith(".md")));
    }

    function parseFrontmatter(md){
      const parts=md.split('---');
      if(parts.length<3) return {data:{}, body:md};
      const yaml=parts[1], body=parts.slice(2).join('---').trim();
      const data={};
      yaml.split(/\r?\n/).forEach(line=>{
        const m=line.match(/^([^:]+):\s*(.*)$/);
        if(m){
          let v=m[2].trim().replace(/^"(.*)"$/,'$1');
          data[m[1].trim()]=v;
        }
      });
      return {data, body};
    }

    function imgTag(src, alt){
      if(!src) return "";
      const src240 = ni(src,240);
      const src480 = ni(src,480);
      return `
        <img
          class="artist-photo"
          src="${src240}"
          srcset="${src240} 240w, ${src480} 480w"
          sizes="240px"
          alt="${alt ? alt.replace(/"/g,'&quot;') : ''}"
          loading="lazy"
          decoding="async"
        >
      `;
    }

    function card(a){
      const name=a.name||a.title||"";
      const img=a.image||a.photo||"";
      const link=a.url||a.link||"";
      return `
        <div class="artist">
          ${imgTag(img, name)}
          <h3>${name}</h3>
          ${link ? `<p style="margin-top:8px;"><a class="btn" href="${link}" target="_blank" rel="noopener noreferrer">More</a></p>` : ""}
        </div>
      `;
    }

    (async ()=>{
      try{
        const files=await listFiles();
        const items=await Promise.all(files.map(async f=>{
          const md=await fetch(f.download_url).then(r=>r.text());
          const {data}=parseFrontmatter(md);
          return data;
        }));

        const producers = items.filter(a => /producer/i.test(a.role||""));
        const vocalists = items.filter(a => /vocal/i.test(a.role||""));

        document.getElementById('producers').innerHTML = producers.map(card).join('');
        document.getElementById('vocalists').innerHTML = vocalists.map(card).join('');
      }catch(e){
        console.error(e);
      }
    })();
  </script>
</body>
</html>
