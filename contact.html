<!DOCTYPE html><html lang="en"><head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact – Oysterdale Records</title>
  

  <!-- SEO -->
  
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  
  
  
  
  

  <!-- Twitter -->
  
  
  
  

  <meta name="theme-color" content="#000">

  <!-- Anti-FOUC -->
  <style>body{opacity:0;transition:opacity .18s ease}</style>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- SEO runtime (fallback) -->
  <script src="js/seo.js" defer="" data-seo="/content/seo/contact.json"></script>

  <!-- Icons -->
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" crossorigin="" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="">
  </noscript>

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer=""></script>

  <!-- Fade-in -->
  <script>
    window.addEventListener("load",()=>{document.body.style.opacity=1;});
  </script>

<meta name="description" content="Contact Oysterdale Records for demos, bookings, press and collaborations."><meta name="keywords" content="Oysterdale Records, Contact, Demo, Booking, Press"><link rel="canonical" href="https://oysterdalerecords.com/contact.html"><meta property="og:type" content="website"><meta property="og:url" content="https://oysterdalerecords.com/contact.html"><meta property="og:title" content="Contact Oysterdale Records"><meta property="og:description" content="Reach out to us for demos, bookings, press and partnerships."><meta property="og:image" content="https://oysterdalerecords.com/uploads/Oysterdale logo for facebook.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Contact Oysterdale Records"><meta name="twitter:description" content="Reach out to us for demos, bookings, press and partnerships."><meta name="twitter:image" content="https://oysterdalerecords.com/uploads/Oysterdale logo for facebook.png"></head>
<body>

  <!-- HEADER -->
  <script>
    fetch("header.html").then(r=>r.text()).then(html=>{
      document.body.insertAdjacentHTML("afterbegin",html);

      const btn=document.getElementById("menu-toggle");
      const nav=document.querySelector(".main-nav");

      if(btn && nav){
        btn.addEventListener("click",()=>{
          const open = nav.classList.toggle("open");
          btn.textContent = open ? "✖" : "☰";
        });

        document.addEventListener("click",e=>{
          if(e.target.closest(".nav-links a")){
            nav.classList.remove("open");
            btn.textContent="☰";
          }
        });
      }
    });
  </script>

  <!-- CONTENT -->
  <main class="page-content fade-in">
    <h1>Contact</h1>
    
    <!-- Success message after newsletter signup -->
    <div id="newsletter-success" style="display:none;background:rgba(107,76,122,0.3);border:1px solid rgba(155,123,184,0.5);border-radius:12px;padding:20px;margin-bottom:2rem;">
      <h3 style="margin:0 0 0.5rem;color:#fff;">🎉 Welcome to the crew!</h3>
      <p style="margin:0;opacity:0.9;">You're subscribed. Watch your inbox for weekly pearls.</p>
    </div>
    
    <div id="contact-content">Loading content...</div>

    <!-- NEWSLETTER SIGNUP -->
    <section id="newsletter-section" style="margin-top:3rem;padding-top:2rem;border-top:1px solid rgba(255,255,255,.1);">
      <h2>Join the Crew</h2>
      <p style="opacity:.7;margin-bottom:1.5rem;">Get weekly pearls delivered to your inbox. No spam, just groove.</p>
      <form name="newsletter" method="POST" action="/contact.html?subscribed=true" data-netlify="true" netlify-honeypot="bot-field" style="max-width:480px;display:flex;flex-direction:column;gap:16px;">
        <p style="display:none;">
          <label>Don't fill this out: <input name="bot-field" /></label>
        </p>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <label for="newsletter-name" style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.7;margin-left:16px;">Name</label>
          <input type="text" id="newsletter-name" name="name" placeholder="Your name" required style="width:100%;padding:12px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#fff;font-size:14px;outline:none;">
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <label for="newsletter-email" style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.7;margin-left:16px;">Email</label>
          <input type="email" id="newsletter-email" name="email" placeholder="your@email.com" required style="width:100%;padding:12px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#fff;font-size:14px;outline:none;">
        </div>
        <button type="submit" style="padding:12px 24px;border-radius:999px;border:none;background:#fff;color:#000;font-weight:700;font-size:14px;cursor:pointer;transition:opacity .2s;margin-top:4px;">Subscribe</button>
      </form>
    </section>
  </main>

  <!-- MARKDOWN LOADER -->
  <script>
    function stripFrontmatter(text){
      const fm=/^\s*---\s*\n[\s\S]*?\n---\s*\n?/;
      return text.replace(fm,"");
    }

    // Show success message if subscribed
    if(window.location.search.includes('subscribed=true')){
      const successDiv = document.getElementById('newsletter-success');
      if(successDiv) successDiv.style.display = 'block';
    }

    (async()=>{
      try{
        const res = await fetch("content/contact.md",{cache:"no-store"});
        if(!res.ok) throw new Error("Failed to load contact.md");
        const md = await res.text();
        const html = marked.parse(stripFrontmatter(md));
        document.getElementById("contact-content").innerHTML = html;
      }catch(err){
        console.error("Contact markdown load error:",err);
        document.getElementById("contact-content").innerHTML = `
          <p>For demos, collaborations, press inquiries, or anything else — feel free to reach out at:</p>
          <p><strong>contact@oysterdalerecords.com</strong></p>
          <h4>Demo submissions</h4>
          <p>We're always open to hearing fresh and exciting music, so feel free to send us private streaming links (SoundCloud, Dropbox, etc.) with a short introduction. We listen to every demo.</p>
          <p><em>Based in Oslo, working worldwide.</em></p>
        `;
      }
    })();
  </script>

  <!-- FOOTER -->
  <script>
    (async function loadFooter(){

      function normalize(src){
        if(!src) return "";
        if(/^https?:\/\//.test(src)) return src;
        return src.startsWith("/") ? src : "/" + src;
      }

      try{
        const r = await fetch("/content/settings/footer.json",{cache:"no-store"});
        const cfg = await r.json();

        const w = Number(cfg.width) || 260;

        const logoPath = normalize(cfg.logo || "/uploads/OysterdaleRecords_white_logo_260.webp");
        const logo = `/.netlify/images?url=${encodeURIComponent(logoPath)}&w=${w}&h=${w}&fit=contain&fm=webp&q=80`;

        const linksHTML = (cfg.links && cfg.links.length)
          ? `<nav class="footer-nav">${cfg.links.map(l=>`<a href="${l.href}">${l.label}</a>`).join(" | ")}</nav>`
          : "";

        const footerHTML = `
          <footer>
            <div class="footer-logo">
              <img src="${logo}"
                   alt="Oysterdale Records Logo"
                   class="footer-logo-img"
                   width="${w}" height="${w}"
                   loading="lazy" decoding="async">
            </div>
            <p>${cfg.text || "© 2025 Oysterdale Records. All rights reserved."}</p>
            ${linksHTML}
          </footer>
        `;

        document.body.insertAdjacentHTML("beforeend",footerHTML);

      }catch(err){
        console.error("Footer load failed:",err);
      }
    })();
  </script>



</body></html>
