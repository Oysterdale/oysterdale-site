<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – Contact</title>

  <!-- (Valgfritt) Runtime-SEO fallback. Build-steget skriver uansett meta i <head>. -->
  <script src="js/seo.js" defer data-seo="/content/seo/contact.json"></script>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <main class="page-content fade-in">
    <h1 class="page-heading">CONTACT</h1>
    <div id="contact-content">Loading content...</div>
  </main>

  <footer>
    <img src="uploads/OysterdaleRecords_white_logo.png" alt="Oysterdale Records Logo" class="footer-logo-img">
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    // Sett inn header og mobilmeny
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.body.insertAdjacentHTML('afterbegin', html);

        const toggleButton = document.getElementById('menu-toggle');
        const nav = document.querySelector('.main-nav');
        const navLinks = document.querySelectorAll('.main-nav a');

        if (toggleButton && nav) {
          toggleButton.addEventListener('click', () => {
            nav.classList.toggle('open');
            toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
          });

          navLinks.forEach(link => {
            link.addEventListener('click', () => {
              if (nav.classList.contains('open')) {
                nav.classList.remove('open');
                toggleButton.textContent = '☰';
              }
            });
          });
        }
      });

    // Stripp frontmatter før markdown-render
    function stripFrontmatter(text) {
      const fm = /^\s*---\s*\n[\s\S]*?\n---\s*\n?/;
      return text.replace(fm, '');
    }

    fetch('content/contact.md')
      .then(res => res.text())
      .then(md => {
        const clean = stripFrontmatter(md);
        document.getElementById('contact-content').innerHTML = marked.parse(clean);
      })
      .catch(err => console.error('Contact markdown load error:', err));
  </script>
</body>
</html>
