<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – Contact</title>

  <!-- Anti-FOUC -->
  <style>body{opacity:0; transition:opacity .18s ease}</style>

  <!-- Viktig: blokkende CSS -->
  <link rel="stylesheet" href="styles.css" />

  <!-- (Valgfritt) Runtime-SEO fallback -->
  <script src="js/seo.js" defer data-seo="/content/seo/contact.json"></script>

  <link rel="icon" href="images/favicon.png" type="image/png" />

  <!-- Font Awesome (non-blocking med preload + noscript fallback) -->
  <link rel="preload"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        as="style" crossorigin
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          crossorigin>
  </noscript>

  <!-- Marked (defer) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

  <!-- Fade inn når alt er lastet -->
  <script>
    window.addEventListener('load', () => { document.body.style.opacity = 1; });
  </script>
</head>
<body>
  <main class="page-content fade-in">
    <h1 class="page-heading">CONTACT</h1>
    <div id="contact-content">Loading content...</div>
  </main>

  <!-- Header & mobilmeny -->
  <script>
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.body.insertAdjacentHTML('afterbegin', html);

        const toggleButton = document.getElementById('menu-toggle');
        const nav = document.querySelector('.main-nav');
        const navLinks = document.querySelectorAll('.main-nav a');

        if (toggleButton && nav) {
          toggleButton.addEventListener('click', () => {
            nav.classList.toggle('open');
            toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
          });

          navLinks.forEach(link => {
            link.addEventListener('click', () => {
              if (nav.classList.contains('open')) {
                nav.classList.remove('open');
                toggleButton.textContent = '☰';
              }
            });
          });
        }
      });
  </script>

  <!-- Stripp frontmatter og render markdown -->
  <script>
    function stripFrontmatter(text) {
      const fm = /^\s*---\s*\n[\s\S]*?\n---\s*\n?/;
      return text.replace(fm, '');
    }

    (async () => {
      try{
        const res = await fetch('content/contact.md', { cache: 'force-cache' });
        const md = await res.text();
        document.getElementById('contact-content').innerHTML = marked.parse(stripFrontmatter(md));
      }catch(err){
        console.error('Contact markdown load error:', err);
      }
    })();
  </script>

  <!-- Dynamisk FOOTER (med linker som på index) -->
  <script>
  (async function loadFooter(){
    try{
      const r = await fetch('/content/settings/footer.json', {cache:'no-store'});
      const cfg = await r.json();

      const w = Number(cfg.width) || 260;
      const logoSrc = cfg.logo
        ? `/.netlify/images?url=${encodeURIComponent(cfg.logo)}&w=${w}&h=${w}&fit=contain&fm=webp&q=80`
        : '/uploads/OysterdaleRecords_white_logo_260.webp';

      const linksHtml = (cfg.links && cfg.links.length)
        ? `<nav class="footer-nav">${cfg.links.map(l => `<a href="${l.href}">${l.label}</a>`).join(" | ")}</nav>`
        : "";

      const html = `
        <footer>
          <div class="footer-logo">
            <img
              src="${logoSrc}"
              alt="Oysterdale Records Logo"
              class="footer-logo-img"
              width="${w}" height="${w}"
              loading="lazy" decoding="async"
            >
          </div>
          <p>${cfg.text || '© 2025 Oysterdale Records. All rights reserved.'}</p>
          ${linksHtml}
        </footer>
      `;
      document.body.insertAdjacentHTML('beforeend', html);
    }catch(e){
      console.error('Footer load failed', e);
    }
  })();
  </script>
</body>
</html>
