<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – Privacy Policy</title>

  <!-- SEO -->
  <script src="js/seo.js" defer data-seo="/content/seo/privacy.json"></script>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <!-- Header -->
  <script>
    fetch("header.html").then(r=>r.text()).then(html=>{
      document.body.insertAdjacentHTML("afterbegin", html);
      const btn=document.getElementById("menu-toggle"), nav=document.querySelector(".main-nav");
      if(btn&&nav){
        const t=()=>{const o=nav.classList.toggle("open");btn.textContent=o?"✖":"☰";};
        btn.addEventListener("click",t);
      }
      // Set active nav state
      if (window.setActiveNav) window.setActiveNav();
    });
  </script>

  <main class="page-content fade-in">
    <h1 class="page-heading">PRIVACY POLICY</h1>
    <div id="privacy-content">Loading content...</div>
  </main>

  <!-- Footer -->
  <script>
  (async function loadFooter(){
    try{
      const r = await fetch('/content/settings/footer.json', {cache:'no-store'});
      const cfg = await r.json();

      const w = Number(cfg.width) || 260;
      const logoSrc = cfg.logo
        ? `/.netlify/images?url=${encodeURIComponent(cfg.logo)}&w=${w}&h=${w}&fit=contain&fm=webp&q=80`
        : '/uploads/OysterdaleRecords_white_logo_260.webp';

      const linksHtml = (cfg.links && cfg.links.length)
        ? `<nav class="footer-nav">${cfg.links.map(l => `<a href="${l.href}">${l.label}</a>`).join(" | ")}</nav>`
        : "";

      const html = `
        <footer>
          <div class="footer-logo">
            <img
              src="${logoSrc}"
              alt="Oysterdale Records Logo"
              class="footer-logo-img"
              width="${w}" height="${w}"
              loading="lazy" decoding="async"
            >
          </div>
          <p>${cfg.text || '© 2026 Oysterdale Records. All rights reserved.'}</p>
          ${linksHtml}
        </footer>
      `;
      document.body.insertAdjacentHTML('beforeend', html);
    }catch(e){
      console.error('Footer load failed', e);
    }
  })();
  </script>

  <!-- Markdown loader -->
  <script>
    function stripFrontmatter(text){
      const fm=/^\s*---\s*\n[\s\S]*?\n---\s*\n?/;
      return text.replace(fm,'');
    }
    window.addEventListener('DOMContentLoaded', () => {
      const target = document.querySelector('#privacy-content');
      if (!target) return;
      fetch('/content/privacy.md', { cache: 'force-cache' })
        .then(res=>res.ok ? res.text() : '')
        .then(md=>{ if(md) target.innerHTML = marked.parse(stripFrontmatter(md)); })
        .catch(()=>{});
    });
  </script>
</body>
</html>
