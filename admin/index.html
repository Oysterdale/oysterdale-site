<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oysterdale Admin</title>
    <link href="./config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      .preview-wrap { max-width: 900px; margin: 24px auto; line-height: 1.5; }
      .preview-card { border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 16px; }
      .preview-cover { width: 100%; max-width: 360px; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; }
      .preview-title { font-size: 1.8rem; font-weight: 700; margin: 12px 0 4px; }
      .preview-sub { opacity: 0.85; margin-bottom: 12px; }
      .links { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
      .link-pill { padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15); text-decoration: none; }
      .tracklist { margin-top: 12px; }
      .tracklist li { margin-left: 18px; }
    </style>
  </head>
  <body>
    <div id="nc-root"></div>

    <!-- Sveltia CMS -->
    <script src="https://unpkg.com/@sveltia/cms@latest/dist/sveltia-cms.js" type="module"></script>
    <script>
      const linkOrder = [
        ["Spotify", "spotify"],
        ["Apple Music", "apple_music"],
        ["Traxsource", "traxsource"],
        ["Beatport", "beatport"],
        ["Deezer", "deezer"],
        ["Amazon Music", "amazon_music"],
        ["YouTube Music", "youtube_music"],
        ["Tidal", "tidal"],
        ["iTunes", "itunes"],
        ["Bandcamp", "bandcamp"],
      ];

      const ReleasesPreview = ({ entry }) => {
        const d = entry.get('data');
        const artist = d.get('artist') || '';
        const featured = d.get('featured') || '';
        const title = d.get('title') || '';
        const date  = d.get('date') || '';
        const cover = d.get('cover') || '';

        const who = featured ? `${artist} feat. ${featured}` : artist;
        const linkHtml = linkOrder.map(([label,key]) => {
          const url = d.get(key);
          return url ? `<a class="link-pill" href="${url}" target="_blank" rel="noopener">${label}</a>` : '';
        }).join('');

        return `
          <div class="preview-wrap">
            <div class="preview-card">
              ${cover ? `<img class="preview-cover" src="${cover}" alt="">` : ''}
              <div class="preview-title">${title}</div>
              <div class="preview-sub">${who}${date ? (who ? ' · ' : '') + new Date(date).toLocaleDateString() : ''}</div>
              <div class="links">${linkHtml}</div>
            </div>
          </div>`;
      };

      const ArtistsPreview = ({ entry }) => {
        const d = entry.get('data');
        const name  = d.get('name') || '';
        const role  = d.get('role') || '';
        const photo = d.get('image') || '';
        const bio   = d.get('bio') || '';
        const socials = [
          ["Spotify", "spotify"],
          ["SoundCloud", "soundcloud"],
          ["Instagram", "instagram"],
          ["Website", "website"],
          ["Mixcloud", "mixcloud"],
          ["Bandcamp", "bandcamp"],
        ].map(([label,key]) => {
          const url = d.get(key);
          return url ? `<a class="link-pill" href="${url}" target="_blank" rel="noopener">${label}</a>` : '';
        }).join('');

        return `
          <div class="preview-wrap">
            <div class="preview-card">
              ${photo ? `<img class="preview-cover" src="${photo}" alt="">` : ''}
              <div class="preview-title">${name}</div>
              <div class="preview-sub">${role || ''}</div>
              <div class="links">${socials}</div>
              ${bio ? `<div class="preview-body">${bio}</div>` : ''}
            </div>
          </div>`;
      };

      if (window.CMS) {
        CMS.registerPreviewTemplate('releases', ReleasesPreview);
        CMS.registerPreviewTemplate('artists',  ArtistsPreview);
      }
    </script>
  </body>
</html>
