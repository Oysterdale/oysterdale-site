backend:
  name: github
  repo: Oysterdale/oysterdale-site
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Index"
        name: "index"
        file: "content/index.md"
        fields:
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "About"
        name: "about"
        file: "content/about.md"
        fields:
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "Artists"
        name: "artists"
        file: "content/artists.md"
        fields:
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "Contact"
        name: "contact"
        file: "content/contact.md"
        fields:
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "releases"
    label: "Releases"
    folder: "releases"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Spotify Link", name: "spotify", widget: "string", required: false }
      - { label: "Traxsource Link", name: "traxsource", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "artist_entries"
    label: "Artists"
    folder: "artists"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Biography", name: "bio", widget: "markdown" }
      - { label: "Releases", name: "releases", widget: "list", required: false, field: {label: "Release Title", name: "release", widget: "string"} }
