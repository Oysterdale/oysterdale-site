backend:
  name: github
  repo: Oysterdale/oysterdale-site   # <- endre org/repo hvis nødvendig
  branch: main

publish_mode: simple

media_folder: "static/uploads"   # filer lagres her i repo
public_folder: "/uploads"        # slik refereres de i HTML

editor:
  preview: true

collections:
  # -------------------------
  # PAGES  (content/*.md)
  # -------------------------
  - name: "pages"
    label: "Pages"
    folder: "content"
    create: true
    extension: "md"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body",  name: "body",  widget: "markdown", required: false }
      - { label: "Hero Image", name: "hero_image", widget: "image", required: false }
      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Meta Title",        name: "meta_title",        widget: "string", required: false }
          - { label: "Meta Description",  name: "meta_description",  widget: "text",   required: false }
          - { label: "Keywords",          name: "keywords",          widget: "string", required: false }
          - { label: "Canonical URL",     name: "canonical",         widget: "string", required: false }
          - { label: "Open Graph Image",  name: "og_image",          widget: "image",  required: false }

  # -------------------------
  # RELEASES  (releases/*.md)
  # -------------------------
  - name: "releases"
    label: "Releases"
    folder: "releases"
    create: true
    extension: "md"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date",  name: "date",  widget: "datetime", required: false }

      # Ryddig og tydelig cover-felt
      - { label: "Cover", name: "cover", widget: "image", required: false }

      # Artists som liste (enkelt å legge til flere)
      - label: "Artists"
        name: "artists"
        widget: "list"
        required: false
        field: { label: "Name", name: "name", widget: "string" }

      # Strukturerte lenker – lett å vedlikeholde
      - label: "Links"
        name: "links"
        widget: "object"
        required: false
        fields:
          - { label: "Spotify",    name: "spotify",    widget: "string", required: false }
          - { label: "Apple Music",name: "apple",      widget: "string", required: false }
          - { label: "Beatport",   name: "beatport",   widget: "string", required: false }
          - { label: "Traxsource", name: "traxsource", widget: "string", required: false }
          - { label: "YouTube",    name: "youtube",    widget: "string", required: false }

      # Tracklist (om/ når du trenger det)
      - label: "Tracklist"
        name: "tracklist"
        widget: "list"
        required: false
        fields:
          - { label: "Title",       name: "title",   widget: "string" }
          - { label: "Version/Mix", name: "version", widget: "string", required: false }
          - { label: "ISRC",        name: "isrc",    widget: "string", required: false }

      - { label: "Body", name: "body", widget: "markdown", required: false }

      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Meta Title",        name: "meta_title",        widget: "string", required: false }
          - { label: "Meta Description",  name: "meta_description",  widget: "text",   required: false }
          - { label: "Keywords",          name: "keywords",          widget: "string", required: false }
          - { label: "Canonical URL",     name: "canonical",         widget: "string", required: false }
          - { label: "Open Graph Image",  name: "og_image",          widget: "image",  required: false }

  # -------------------------
  # ARTISTS  (artists/*.md)
  # -------------------------
  - name: "artists"
    label: "Artists"
    folder: "artists"
    create: true
    extension: "md"
    slug: "{{slug}}"
    fields:
      - { label: "Name",  name: "title", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image", required: false }

      - label: "Socials"
        name: "socials"
        widget: "list"
        required: false
        fields:
          - { label: "Platform", name: "platform", widget: "string" }
          - { label: "URL",      name: "url",      widget: "string" }

      - { label: "Bio", name: "body", widget: "markdown", required: false }

      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Meta Title",        name: "meta_title",        widget: "string", required: false }
          - { label: "Meta Description",  name: "meta_description",  widget: "text",   required: false }
          - { label: "Keywords",          name: "keywords",          widget: "string", required: false }
          - { label: "Canonical URL",     name: "canonical",         widget: "string", required: false }
          - { label: "Open Graph Image",  name: "og_image",          widget: "image",  required: false }
