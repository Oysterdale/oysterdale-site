backend:
  name: github
  repo: Oysterdale/oysterdale-site
  branch: main

publish_mode: simple

media_folder: "uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:

  # -------------------------
  # PAGES (HTML-layoutfiler)
  # -------------------------
  - name: "pages"
    label: "Pages (Layout)"
    files:
      - file: "index.html"
        label: "Home (layout)"
        name: "home"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
              - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
              - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
              - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
              - label: "Open Graph Image"
                name: "og_image"
                widget: "image"
                required: false
                multiple: false
                media_folder: "uploads/og"
                public_folder: "/uploads/og"

      - file: "about.html"
        label: "About (layout)"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
              - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
              - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
              - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
              - label: "Open Graph Image"
                name: "og_image"
                widget: "image"
                required: false
                multiple: false
                media_folder: "uploads/og"
                public_folder: "/uploads/og"

      - file: "releases.html"
        label: "Releases Page (layout)"
        name: "releases_page"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
              - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
              - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
              - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
              - label: "Open Graph Image"
                name: "og_image"
                widget: "image"
                required: false
                multiple: false
                media_folder: "uploads/og"
                public_folder: "/uploads/og"

      - file: "artists.html"
        label: "Artists Page (layout)"
        name: "artists_page"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
              - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
              - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
              - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
              - label: "Open Graph Image"
                name: "og_image"
                widget: "image"
                required: false
                multiple: false
                media_folder: "uploads/og"
                public_folder: "/uploads/og"

      - file: "contact.html"
        label: "Contact (layout)"
        name: "contact"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
              - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
              - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
              - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
              - label: "Open Graph Image"
                name: "og_image"
                widget: "image"
                required: false
                multiple: false
                media_folder: "uploads/og"
                public_folder: "/uploads/og"

      - file: "privacy.html"
        label: "Privacy Policy (layout)"
        name: "privacy"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
              - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
              - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
              - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
              - label: "Open Graph Image"
                name: "og_image"
                widget: "image"
                required: false
                multiple: false
                media_folder: "uploads/og"
                public_folder: "/uploads/og"

  # -------------------------
  # SETTINGS (Home + Footer)
  # -------------------------
  - name: "settings"
    label: "Settings"
    files:
      - file: "data/home.json"
        label: "Home"
        name: "home_settings"
        format: "json"
        fields:

          # -------------------------
          # Hero images
          # -------------------------
          - label: "Forsidebilder (Home)"
            name: "hero_images"
            widget: "list"
            required: false
            summary: "{{fields.image}}"
            fields:
              - { label: "Bilde", name: "image", widget: "image", required: true }

          - { label: "Bytte hvert (sekunder)", name: "hero_interval_seconds", widget: "number", value_type: "int", min: 2, max: 30, default: 7 }
          - { label: "Fade-varighet (ms)", name: "hero_fade_ms", widget: "number", value_type: "int", min: 100, max: 3000, default: 800 }

          # -------------------------
          # Headings (legacy / fixed)
          # -------------------------
          - label: "Headings (per plassering på siden)"
            name: "headings"
            widget: "list"
            required: false
            fields:
              - label: "Heading ID (må matche HTML)"
                name: "id"
                widget: "select"
                options:
                  - { label: "Latest Release", value: "heading-latest-release" }
                  - { label: "Playlists", value: "heading-playlists" }
              - { label: "Tekst", name: "text", widget: "string", required: true }

          # -------------------------
          # HOME SECTIONS (fri struktur)
          # -------------------------
          - label: "Home Sections (fri struktur)"
            name: "sections"
            widget: "list"
            required: false
            summary: "{{fields.type}} — {{fields.heading}}"
            fields:
              - label: "Section type"
                name: "type"
                widget: "select"
                options:
                  - { label: "Heading", value: "heading" }
                  - { label: "Text / Rich text", value: "text" }
                  - { label: "Links / Buttons", value: "links" }
                  - { label: "Spotify Playlists", value: "spotify" }
                  - { label: "Custom HTML", value: "html" }

              - { label: "Heading", name: "heading", widget: "string", required: false }

              - label: "Marquee"
                name: "marquee"
                widget: "object"
                required: false
                fields:
                  - { label: "Enable marquee?", name: "enabled", widget: "boolean", default: false }
                  - { label: "Speed", name: "speed", widget: "number", value_type: "int", min: 6, max: 60, default: 22 }

              - { label: "Text content", name: "body", widget: "markdown", required: false }

              - label: "Links"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
                  - { label: "New tab?", name: "new_tab", widget: "boolean", default: false }

              - label: "Spotify playlists"
                name: "spotify_playlists"
                widget: "list"
                required: false
                fields:
                  - { label: "Title", name: "title", widget: "string", required: false }
                  - { label: "Embed", name: "embed", widget: "text", required: true }

              - { label: "Custom HTML", name: "html", widget: "text", required: false }

      - file: "content/settings/footer.json"
        label: "Footer"
        name: "footer"
        format: "json"
        fields:
          - { label: "Footer text", name: "text", widget: "string", required: false }
          - { label: "Logo", name: "logo", widget: "image", required: false }
          - { label: "Logo width", name: "width", widget: "number", value_type: "int", min: 120, max: 400, default: 260 }
          - label: "Links"
            name: "links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
