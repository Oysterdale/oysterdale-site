backend:
  name: github
  repo: Oysterdale/oysterdale-site
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # -------------------------
  # PAGES (HTML-layoutfiler)
  # -------------------------
  - name: "pages"
    label: "Pages (Layout)"
    files:
      - file: "index.html"
        label: "Home (layout)"
        name: "home"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
              - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
              - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
              - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
              - label: "Open Graph Image"
                name: "og_image"
                widget: "image"
                required: false
                allow_multiple: false
                media_folder: "uploads/og"
                public_folder: "/uploads/og"

      - file: "about.html"
        label: "About (layout)"
        name: "about"
        fields: *ref_0

      - file: "releases.html"
        label: "Releases Page (layout)"
        name: "releases_page"
        fields: *ref_0

      - file: "artists.html"
        label: "Artists Page (layout)"
        name: "artists_page"
        fields: *ref_0

      - file: "contact.html"
        label: "Contact (layout)"
        name: "contact"
        fields: *ref_0

      - file: "privacy.html"
        label: "Privacy Policy (layout)"
        name: "privacy"
        fields: *ref_0

  # -------------------------
  # PAGE CONTENT (Markdown)
  # -------------------------
  - name: "page_content"
    label: "Page Content"
    files:
      - file: "content/index.md"
        label: "Home Content"
        name: "index_md"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
          - label: "Spotify Embeds"
            name: "spotify"
            widget: "list"
            hint: "Legg til en eller flere Spotify embed-lenker"
            fields:
              - { label: "Embed URL", name: "url", widget: "string" }

      - file: "content/about.md"
        label: "About Content"
        name: "about_md"
        fields: *ref_1

      - file: "content/releases.md"
        label: "Releases Content"
        name: "releases_md"
        fields: *ref_1

      - file: "content/artists.md"
        label: "Artists Content"
        name: "artists_md"
        fields: *ref_1

      - file: "content/contact.md"
        label: "Contact Content"
        name: "contact_md"
        fields: *ref_1

      - file: "content/events.md"
        label: "Events Content"
        name: "events_md"
        fields: *ref_1

      - file: "content/privacy.md"
        label: "Privacy Policy Content"
        name: "privacy_md"
        fields: *ref_1

  # -------------------------
  # RELEASES
  # -------------------------
  - name: "releases"
    label: "Releases"
    folder: "releases"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Artists"
        name: "artists"
        widget: "list"
        summary: "{{fields.artist}}"
        field:
          { label: "Artist", name: "artist", widget: "string", hint: "Skriv inn navn fritt, eller bruk samme navn som i Artists-samlingen" }
      - { label: "Release Date", name: "date", widget: "datetime", time_format: false, required: false }
      - { label: "Catalog Number", name: "catalog", widget: "string", required: false }
      - { label: "Cover", name: "cover", widget: "image", required: false, allow_multiple: false }

      # Links
      - label: "Links"
        name: "links"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Spotify",        name: "spotify_url",      widget: "string", required: false }
          - { label: "Apple Music",    name: "apple_music_url",  widget: "string", required: false }
          - { label: "iTunes",         name: "itunes_url",       widget: "string", required: false }
          - { label: "Tidal",          name: "tidal_url",        widget: "string", required: false }
          - { label: "Amazon Music",   name: "amazon_music_url", widget: "string", required: false }
          - { label: "YouTube",        name: "youtube_url",      widget: "string", required: false }
          - { label: "Traxsource",     name: "traxsource_url",   widget: "string", required: false }
          - { label: "Beatport",       name: "beatport_url",     widget: "string", required: false }
          - { label: "Deezer",         name: "deezer_url",       widget: "string", required: false }

      - { label: "Description", name: "body", widget: "markdown", required: false }
      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields: *ref_2

  # -------------------------
  # ARTISTS
  # -------------------------
  - name: "artists"
    label: "Artists"
    folder: "artists"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - label: "Role"
        name: "role"
        widget: "select"
        options:
          - { label: "Producer / Main Artist", value: "producer" }
          - { label: "Vocalist", value: "vocalist" }
      - { label: "Profile Image", name: "image", widget: "image", allow_multiple: false, required: false }
      - { label: "Bio", name: "bio", widget: "text", required: false }
      - { label: "Spotify", name: "spotify", widget: "string", required: false }
      - { label: "SoundCloud", name: "soundcloud", widget: "string", required: false }
      - { label: "Instagram", name: "instagram", widget: "string", required: false }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Mixcloud", name: "mixcloud", widget: "string", required: false }
      - { label: "Bandcamp", name: "bandcamp", widget: "string", required: false }
      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields: *ref_2

  # -------------------------
  # SEO JSON (for seo.js)
  # -------------------------
  - name: "seo_pages"
    label: "SEO (Pages JSON)"
    label_singular: "SEO Page"
    folder: "content/seo"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "page"
    fields: *ref_3

  # -------------------------
  # SETTINGS (Home + Footer)
  # -------------------------
  - name: "settings"
    label: "Settings"
    files:
      - file: "data/home.json"
        label: "Home"
        name: "home_settings"
        format: "json"
        fields:
          - label: "Forsidebilde (Home)"
            name: "hero_image"
            widget: "image"
            choose_url: true
            allow_multiple: false
            required: false
            hint: "Velg/last opp forsidebildet. Hvis tomt brukes standardbildet i index.html."

      - file: "content/settings/footer.json"
        label: "Footer"
        name: "footer"
        format: "json"
        fields:
          - { label: "Footer text", name: "text", widget: "string", required: false }
          - { label: "Logo", name: "logo", widget: "image", required: false, media_folder: "uploads", public_folder: "/uploads" }
          - { label: "Logo width (px)", name: "width", widget: "number", required: false, value_type: "int", min: 120, max: 400, default: 260 }
          - label: "Links"
            name: "links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
