backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "index"
        label: "Home"
        file: "content/index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "about"
        label: "About"
        file: "content/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "events"
        label: "Events"
        file: "content/events.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "contact"
        label: "Contact"
        file: "content/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "releases"
    label: "Releases"
    folder: "releases"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Artist", name: "artist", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Featured Artist (optional)", name: "featured", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Cover image (optional)", name: "cover", widget: "image", required: false }
      - { label: "Spotify URL (optional)", name: "spotify", widget: "string", required: false }
      - { label: "Traxsource URL (optional)", name: "traxsource", widget: "string", required: false }
      - { label: "Body (optional)", name: "body", widget: "markdown", required: false }
