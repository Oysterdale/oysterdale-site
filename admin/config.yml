backend:
  name: github
  repo: Oysterdale/oysterdale-site
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # -------------------------
  # PAGES (enkeltfiler: index, about, releases page, artists page, contact)
  # -------------------------
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home"
        name: "home"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
              - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
              - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
              - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
              - label: "Open Graph Image"
                name: "og_image"
                widget: "image"
                required: false
                allow_multiple: false
                media_folder: "uploads/og"
                public_folder: "/uploads/og"

      - file: "about.html"
        label: "About"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
              - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
              - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
              - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
              - label: "Open Graph Image"
                name: "og_image"
                widget: "image"
                required: false
                allow_multiple: false
                media_folder: "uploads/og"
                public_folder: "/uploads/og"

      - file: "releases.html"
        label: "Releases Page"
        name: "releases_page"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
              - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
              - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
              - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
              - label: "Open Graph Image"
                name: "og_image"
                widget: "image"
                required: false
                allow_multiple: false
                media_folder: "uploads/og"
                public_folder: "/uploads/og"

      - file: "artists.html"
        label: "Artists Page"
        name: "artists_page"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
              - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
              - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
              - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
              - label: "Open Graph Image"
                name: "og_image"
                widget: "image"
                required: false
                allow_multiple: false
                media_folder: "uploads/og"
                public_folder: "/uploads/og"

      - file: "contact.html"
        label: "Contact"
        name: "contact"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
          - label: "SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
              - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
              - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
              - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
              - label: "Open Graph Image"
                name: "og_image"
                widget: "image"
                required: false
                allow_multiple: false
                media_folder: "uploads/og"
                public_folder: "/uploads/og"

  # -------------------------
  # RELEASES (mappebasert)
  # -------------------------
  - name: "releases"
    label: "Releases"
    folder: "releases"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Artists"
        name: "artists"
        widget: "relation"
        collection: "artists"
        search_fields: ["name", "role"]
        value_field: "name"
        display_fields: ["name"]
        multiple: true
        required: false
      - { label: "Release Date", name: "date", widget: "datetime", time_format: false, required: false }
      - { label: "Catalog Number", name: "catalog", widget: "string", required: false }
      - { label: "Cover", name: "cover", widget: "image", required: false, allow_multiple: false }
      - label: "Links"
        name: "links"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Spotify", name: "spotify", widget: "string", required: false }
          - { label: "Apple Music", name: "apple", widget: "string", required: false }
          - { label: "Beatport", name: "beatport", widget: "string", required: false }
          - { label: "Traxsource", name: "traxsource", widget: "string", required: false }
          - { label: "YouTube", name: "youtube", widget: "string", required: false }
      - { label: "Description", name: "body", widget: "markdown", required: false }

      # SEO for Releases
      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
          - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
          - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
          - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
          - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
          - label: "Open Graph Image"
            name: "og_image"
            widget: "image"
            required: false
            allow_multiple: false
            media_folder: "uploads/og"
            public_folder: "/uploads/og"

  # -------------------------
  # ARTISTS (mappebasert)
  # -------------------------
  - name: "artists"
    label: "Artists"
    folder: "artists"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - label: "Role"
        name: "role"
        widget: "select"
        options:
          - { label: "Producer / Main Artist", value: "producer" }
          - { label: "Vocalist", value: "vocalist" }
      - { label: "Profile Image", name: "image", widget: "image", allow_multiple: false, required: false }
      - { label: "Bio", name: "bio", widget: "text", required: false }
      - { label: "Spotify", name: "spotify", widget: "string", required: false }
      - { label: "SoundCloud", name: "soundcloud", widget: "string", required: false }
      - { label: "Instagram", name: "instagram", widget: "string", required: false }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Mixcloud", name: "mixcloud", widget: "string", required: false }
      - { label: "Bandcamp", name: "bandcamp", widget: "string", required: false }

      # SEO for Artists
      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
          - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
          - { label: "Keywords", name: "keywords", widget: "list", required: false, default: [] }
          - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
          - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
          - label: "Open Graph Image"
            name: "og_image"
            widget: "image"
            required: false
            allow_multiple: false
            media_folder: "uploads/og"
            public_folder: "/uploads/og"

  # -------------------------
  # SEO JSON (for seo.js)
  # -------------------------
  - name: "seo_pages"
    label: "SEO (Pages JSON)"
    label_singular: "SEO Page"
    folder: "content/seo"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "page"
    fields:
      - { label: "Page", name: "page", widget: "string", hint: "f.eks. index, about, releases, artists, contact", required: true }
      - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
      - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
      - { label: "Keywords", name: "keywords", widget: "list", required: false }
      - { label: "Open Graph Title", name: "og_title", widget: "string", required: false }
      - { label: "Open Graph Description", name: "og_description", widget: "text", required: false }
      - label: "Open Graph Image"
        name: "og_image"
        widget: "image"
        required: false
        allow_multiple: false
        media_folder: "uploads/og"
        public_folder: "/uploads/og"
