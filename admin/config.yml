backend:
  name: github
  repo: Oysterdale/oysterdale-site   # <-- endre hvis org/repo er annerledes
  branch: main                       # <-- endre hvis du bruker annen branch

publish_mode: simple

media_folder: "static/uploads"   # lagringsmappe i repo
public_folder: "/uploads"        # slik filene refereres i HTML

editor:
  preview: true

collections:
  # -------------------------
  # PAGES  (content/*.md)
  # -------------------------
  - name: "pages"
    label: "Pages"
    folder: "content"
    create: true
    extension: "md"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body",  name: "body",  widget: "markdown", required: false }
      # Bruker samme bildefelt som mange statiske oppsett: "image"
      - { label: "Hero Image", name: "image", widget: "image", required: false }

      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Meta Title",        name: "meta_title",        widget: "string", required: false }
          - { label: "Meta Description",  name: "meta_description",  widget: "text",   required: false }
          - { label: "Keywords",          name: "keywords",          widget: "string", required: false }
          - { label: "Canonical URL",     name: "canonical",         widget: "string", required: false }
          - { label: "Open Graph Image",  name: "og_image",          widget: "image",  required: false }

  # -------------------------
  # RELEASES  (releases/*.md)
  # -------------------------
  - name: "releases"
    label: "Releases"
    folder: "releases"
    create: true
    extension: "md"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date",  name: "date",  widget: "datetime", required: false }

      # Viktig: beholder eksakt feltnavn "image" som cover-bilde
      - { label: "Cover Image", name: "image", widget: "image", required: false }

      # Artists: mange av filene dine bruker enkel streng "artist"
      - { label: "Artist", name: "artist", widget: "string", required: false }

      # Flate lenkefelter som du allerede har i filene:
      - { label: "Spotify URL",    name: "spotify_link",    widget: "string", required: false }
      - { label: "Apple Music URL",name: "apple_music",     widget: "string", required: false }  # (evt. itunes)
      - { label: "Beatport URL",   name: "beatport_link",   widget: "string", required: false }
      - { label: "Traxsource URL", name: "traxsource_link", widget: "string", required: false }
      - { label: "YouTube URL",    name: "youtube_link",    widget: "string", required: false }

      # Tracklist (hvis du bruker den)
      - label: "Tracklist"
        name: "tracklist"
        widget: "list"
        required: false
        fields:
          - { label: "Title",       name: "title",   widget: "string" }
          - { label: "Version/Mix", name: "version", widget: "string", required: false }
          - { label: "ISRC",        name: "isrc",    widget: "string", required: false }

      - { label: "Body", name: "body", widget: "markdown", required: false }

      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Meta Title",        name: "meta_title",        widget: "string", required: false }
          - { label: "Meta Description",  name: "meta_description",  widget: "text",   required: false }
          - { label: "Keywords",          name: "keywords",          widget: "string", required: false }
          - { label: "Canonical URL",     name: "canonical",         widget: "string", required: false }
          - { label: "Open Graph Image",  name: "og_image",          widget: "image",  required: false }

  # -------------------------
  # ARTISTS  (artists/*.md)
  # -------------------------
  - name: "artists"
    label: "Artists"
    folder: "artists"
    create: true
    extension: "md"
    slug: "{{slug}}"
    fields:
      # De fleste av artist-filene dine bruker title for navn.
      - { label: "Name",  name: "title", widget: "string" }

      # Foto: behold det mest brukte navnet "image"
      - { label: "Photo", name: "image", widget: "image", required: false }

      # Enkle sosiale lenker hvis du har dem flatt i frontmatter:
      - { label: "Instagram",  name: "instagram",  widget: "string", required: false }
      - { label: "Spotify",    name: "spotify",    widget: "string", required: false }
      - { label: "YouTube",    name: "youtube",    widget: "string", required: false }
      - { label: "SoundCloud", name: "soundcloud", widget: "string", required: false }
      - { label: "Website",    name: "website",    widget: "string", required: false }

      - { label: "Bio",   name: "body", widget: "markdown", required: false }

      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Meta Title",        name: "meta_title",        widget: "string", required: false }
          - { label: "Meta Description",  name: "meta_description",  widget: "text",   required: false }
          - { label: "Keywords",          name: "keywords",          widget: "string", required: false }
          - { label: "Canonical URL",     name: "canonical",         widget: "string", required: false }
          - { label: "Open Graph Image",  name: "og_image",          widget: "image",  required: false }
