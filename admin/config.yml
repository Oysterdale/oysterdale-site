backend:
  name: github
  repo: Oysterdale/oysterdale-site # Endre hvis repo/owner heter noe annet
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home"
        name: "home"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "about.html"
        label: "About"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "releases.html"
        label: "Releases Page"
        name: "releases_page"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "releases"
    label: "Releases"
    folder: "releases"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date"]
    fields:
      - { label: "Artist", name: "artist", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Featured Artist (optional)", name: "featured", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", default: "" }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Spotify Link", name: "spotify", widget: "string", required: false }
      - { label: "Traxsource Link", name: "traxsource", widget: "string", required: false }
      - { label: "Beatport Link", name: "beatport", widget: "string", required: false }
      - { label: "Apple Music Link", name: "apple_music", widget: "string", required: false }
