backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.md"
        label: "Home Page"
        name: "index"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - file: "about.md"
        label: "About Page"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "releases"
    label: "Releases"
    folder: "releases"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Artists", name: "artists", widget: "string" }
      - { label: "Featuring Artists", name: "featuring", widget: "string", required: false }
      - { label: "Release Date", name: "release_date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Cover Image", name: "cover", widget: "image", allow_multiple: false }
      - { label: "Buy/Stream Link", name: "link", widget: "string", required: false }

  - name: "artists"
    label: "Artists"
    folder: "artists"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - label: "Role"
        name: "role"
        widget: "select"
        options:
          - { label: "Producer / Main Artist", value: "producer" }
          - { label: "Vocalist", value: "vocalist" }
      - { label: "Profile Image", name: "image", widget: "image", allow_multiple: false }
      - { label: "Bio", name: "bio", widget: "text" }
      - { label: "Spotify", name: "spotify", widget: "string", required: false }
      - { label: "SoundCloud", name: "soundcloud", widget: "string", required: false }
      - { label: "Instagram", name: "instagram", widget: "string", required: false }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Mixcloud", name: "mixcloud", widget: "string", required: false }
      - { label: "Bandcamp", name: "bandcamp", widget: "string", required: false }
