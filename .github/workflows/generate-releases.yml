name: Generate Release Pages

on:
  push:
    paths:
      - 'releases/**'
      - 'scripts/generate-release-pages.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Generate release pages
        run: |
          node scripts/generate-release-pages.js
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add releases/
          git add releases.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate release pages and releases.json"
          git push
