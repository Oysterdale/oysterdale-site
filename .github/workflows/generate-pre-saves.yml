name: Generate Pre-save Pages

on:
  push:
    paths:
      - 'pre-saves/**'
      - 'content/pre-save-settings.md'
      - 'scripts/generate-pre-save-pages.js'
      - 'pre-save/pre-save-template.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate pre-save pages
        run: |
          node scripts/generate-pre-save-pages.js

      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add pre-save/ pre-saves.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate pre-save pages"
          git push
