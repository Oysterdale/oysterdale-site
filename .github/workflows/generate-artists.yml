name: Generate Artist Pages

on:
  push:
    paths:
      - 'artists/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Generate artist pages
        run: |
          node scripts/generate-artist-pages.js
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add artists/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate artist pages"
          git push
