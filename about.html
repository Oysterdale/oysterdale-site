<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About — Oysterdale Records</title>
  <link rel="canonical" href="https://oysterdalerecords.com/about">
  <meta name="description" content="About Oysterdale Records — ‘Every Record Is a Pearl’." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page-content">
    <h1>About</h1>
    <div class="document-container">
      <p><em>Every record is a pearl!</em></p>
      <p>Oysterdale Records is a house & disco label from Oslo, Norway. We release music monthly and
      focus on DJ-friendly cuts that work on the floor — both digital and vinyl.</p>
    </div>
  </main>

  <footer>
    <div class="footer-logo"><img class="footer-logo-img" src="uploads/OysterdaleRecords_white_logo.png" alt=""></div>
    <p>&copy; <span id="year"></span> Oysterdale Records</p>
  </footer>

  <script>
    fetch("header.html").then(r=>r.text()).then(html=>{
      document.getElementById("site-header").innerHTML = html;
      const btn=document.querySelector(".menu-toggle"), nav=document.querySelector(".main-nav");
      if(btn&&nav){
        const t=()=>{const o=nav.classList.toggle("open");btn.setAttribute("aria-expanded",String(o));};
        btn.addEventListener("click",t);
        document.addEventListener("click",e=>{if(e.target.closest(".nav-links a")) nav.classList.remove("open");});
        document.addEventListener("keydown",e=>{if(e.key==="Escape") nav.classList.remove("open");});
      }
    });
    document.getElementById("year").textContent=new Date().getFullYear();
  </script>
</body>
</html>
