<!DOCTYPE html><html lang="en"><head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>About – Oysterdale Records</title>
  

  
  <meta name="robots" content="index, follow">

  <!-- OpenGraph -->
  
  
  
  
  

  <!-- Twitter -->
  
  
  
  

  <meta name="theme-color" content="#000000">

  <!-- Anti-FOUC -->
  <style>body{opacity:0;transition:opacity .18s ease}</style>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- SEO injector runtime -->
  <script src="js/seo.js" defer="" data-seo="/content/seo/about.json"></script>

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" crossorigin="" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="">
  </noscript>

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer=""></script>

  <!-- Fade-in -->
  <script>
    window.addEventListener("load",()=>{document.body.style.opacity=1;});
  </script>

<meta name="description" content="About Oysterdale Records: an independent Oslo-based label focused on club-first house and disco. Every record is a pearl."><meta name="keywords" content="Oysterdale Records, About, House, Disco, Oslo"><link rel="canonical" href="https://oysterdalerecords.com/about.html"><meta property="og:type" content="website"><meta property="og:url" content="https://oysterdalerecords.com/about.html"><meta property="og:title" content="About Oysterdale Records"><meta property="og:description" content="Learn more about our label, artists and releases."><meta property="og:image" content="https://oysterdalerecords.com/uploads/Oysterdale logo for facebook.png"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="About Oysterdale Records"><meta name="twitter:description" content="Learn more about our label, artists and releases."><meta name="twitter:image" content="https://oysterdalerecords.com/uploads/Oysterdale logo for facebook.png"></head>
<body>

  <!-- HEADER -->
  <script>
    fetch("header.html").then(r=>r.text()).then(html=>{
      document.body.insertAdjacentHTML("afterbegin",html);
      const btn=document.getElementById("menu-toggle");
      const nav=document.querySelector(".main-nav");
      if(btn && nav){
        btn.addEventListener("click",()=>{
          const open = nav.classList.toggle("open");
          btn.textContent = open ? "✖" : "☰";
        });
        document.addEventListener("click",e=>{
          if(e.target.closest(".nav-links a")){
            nav.classList.remove("open");
            btn.textContent="☰";
          }
        });
      }
      // Set active nav state
      if (window.setActiveNav) window.setActiveNav();
    });
  </script>

  <!-- HERO -->
  <div class="page-hero">
    <img class="hero-image" src="uploads/okplus_bjorvika.jpg" alt="Photo of OKPLUS in Bjørvika, Oslo" loading="eager" decoding="async">
  </div>

  <!-- CONTENT -->
  <main class="page-content">
    <h1>About</h1>
    <div id="about-content">Loading...</div>

    <!-- NEWSLETTER SIGNUP -->
    <section id="newsletter-section" style="margin-top:3rem;padding-top:2rem;border-top:1px solid rgba(255,255,255,.1);">
      <h2>Join the Crew</h2>
      <p style="opacity:.7;margin-bottom:1.5rem;">Get weekly pearls delivered to your inbox. No spam, just groove.</p>
      
      <!-- Success message (hidden by default) -->
      <div id="newsletter-success" style="display:none;max-width:480px;text-align:center;background:rgba(107,76,122,0.3);border:1px solid rgba(155,123,184,0.5);border-radius:12px;padding:20px;">
        <div style="font-size:32px;margin-bottom:8px;">✅</div>
        <h3 style="margin:0 0 0.5rem;color:#fff;">Welcome to the crew!</h3>
        <p style="margin:0;opacity:0.9;">Thank you for joining the family. Watch your inbox for weekly pearls.</p>
      </div>
      
      <form id="newsletter-form" name="newsletter" method="POST" data-netlify="true" netlify-honeypot="bot-field" style="max-width:480px;display:flex;flex-direction:column;gap:16px;">
        <p style="display:none;">
          <label>Don't fill this out: <input name="bot-field"></label>
        </p>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <label for="newsletter-name" style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.7;margin-left:16px;">Name</label>
          <input type="text" id="newsletter-name" name="name" placeholder="Your name" required="" style="width:100%;padding:12px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#fff;font-size:14px;outline:none;">
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <label for="newsletter-email" style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.7;margin-left:16px;">Email</label>
          <input type="email" id="newsletter-email" name="email" placeholder="your@email.com" required="" style="width:100%;padding:12px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#fff;font-size:14px;outline:none;">
        </div>
        <button type="submit" style="padding:12px 24px;border-radius:999px;border:none;background:#fff;color:#000;font-weight:700;font-size:14px;cursor:pointer;transition:opacity .2s;margin-top:4px;">Subscribe</button>
      </form>
    </section>

    <!-- NEWSLETTER AJAX HANDLER -->
    <script>
    (function(){
      const form = document.getElementById('newsletter-form');
      const success = document.getElementById('newsletter-success');
      if(!form) return;
      
      form.addEventListener('submit', function(e){
        const btn = form.querySelector('button[type="submit"]');
        btn.textContent = 'Subscribing...';
        btn.disabled = true;
      });
    })();
    </script>
  </main>

  <!-- MARKDOWN LOADER -->
  <script>
    function stripFrontmatter(text){
      const fm=/^\s*---\s*\n[\s\S]*?\n---\s*\n?/;
      return text.replace(fm,"");
    }

    (async()=>{
      try{
        const res = await fetch("content/about.md",{cache:"force-cache"});
        const raw = await res.text();
        const clean = stripFrontmatter(raw);
        document.getElementById("about-content").innerHTML = marked.parse(clean);
      }catch(err){
        console.error("About.md load error:",err);
      }
    })();
  </script>

  <!-- FOOTER -->
  <script>
    (async function loadFooter(){
      function normalize(path){
        if(!path) return "";
        if(/^https?:\/\//.test(path)) return path;
        return path.startsWith("/") ? path : "/" + path;
      }
      try{
        const r = await fetch("/content/settings/footer.json",{cache:"no-store"});
        const cfg = await r.json();

        const w = Number(cfg.width) || 260;
        const logoPath = normalize(cfg.logo || "/uploads/OysterdaleRecords_white_logo_260.webp");
        const logo = `/.netlify/images?url=${encodeURIComponent(logoPath)}&w=${w}&h=${w}&fit=contain&fm=webp&q=80`;

        const linksHtml = (cfg.links && cfg.links.length)
          ? `<nav class="footer-nav">${cfg.links.map(l => `<a href="${l.href}">${l.label}</a>`).join(" | ")}</nav>`
          : "";

        const footerHtml = `
          <footer>
            <div class="footer-logo">
              <a href="/" aria-label="Home">
                <img src="${logo}"
                     alt="Oysterdale Records Logo"
                     class="footer-logo-img"
                     width="${w}" height="${w}"
                     loading="lazy" decoding="async">
              </a>
            </div>
            <p>${cfg.text || "© 2026 Oysterdale Records. All rights reserved."}</p>
            ${linksHtml}
          </footer>`;

        document.body.insertAdjacentHTML("beforeend",footerHtml);
      }catch(e){
        console.error("Footer load failed",e);
      }
    })();
  </script>



</body></html>
