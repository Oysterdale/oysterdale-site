<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – About</title>

  <!-- (Valgfritt) Runtime-SEO fallback. Build-steget skriver uansett meta i <head>. -->
  <script src="js/seo.js" defer data-seo="/content/seo/about.json"></script>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Hero image with title -->
  <div class="page-hero">
    <img class="hero-image" src="uploads/okplus_bjorvika.jpg" alt="Image of OkPlus in front of a city landscape"/>
    <h1>About</h1>
  </div>

  <!-- Main content -->
  <main class="page-content">
    <div id="about-content">Loading content...</div>
  </main>

  <!-- Header & nav script -->
  <script>
    // Sett inn header øverst i body og aktiver meny
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.body.insertAdjacentHTML('afterbegin', html);

        const toggleButton = document.getElementById('menu-toggle');
        const nav = document.querySelector('.main-nav');
        const navLinks = document.querySelectorAll('.main-nav a');

        if (toggleButton && nav) {
          toggleButton.addEventListener('click', () => {
            nav.classList.toggle('open');
            toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
          });
          navLinks.forEach(link => {
            link.addEventListener('click', () => {
              if (nav.classList.contains('open')) {
                nav.classList.remove('open');
                toggleButton.textContent = '☰';
              }
            });
          });
        }
      });

    // Stripp YAML-frontmatter (--- … ---) fra markdown før rendering
    function stripFrontmatter(text) {
      const fm = /^\s*---\s*\n[\s\S]*?\n---\s*\n?/;
      return text.replace(fm, '');
    }

    // Last og render innholdet
    fetch('content/about.md')
      .then(res => res.text())
      .then(md => {
        const clean = stripFrontmatter(md);
        document.getElementById('about-content').innerHTML = marked.parse(clean);
      })
      .catch(err => console.error('About markdown load error:', err));
  </script>

  <!-- Dynamisk FOOTER (henter fra content/settings/footer.json) -->
  <script>
  (async function loadFooter(){
    try{
      const r = await fetch('/content/settings/footer.json', {cache:'no-store'});
      const cfg = await r.json();

      const w = Number(cfg.width) || 260;
      const logoSrc = cfg.logo
        ? `/.netlify/images?url=${encodeURIComponent(cfg.logo)}&w=${w}&h=${w}&fit=contain&fm=webp&q=80`
        : '/uploads/OysterdaleRecords_white_logo_260.webp';

      const html = `
        <footer>
          <div class="footer-logo">
            <img
              src="${logoSrc}"
              alt="Oysterdale Records Logo"
              class="footer-logo-img"
              width="${w}" height="${w}"
              loading="lazy" decoding="async"
            >
          </div>
          <p>${cfg.text || '© 2025 Oysterdale Records. All rights reserved.'}</p>
        </footer>
      `;
      document.body.insertAdjacentHTML('beforeend', html);
    }catch(e){
      console.error('Footer load failed', e);
    }
  })();
  </script>
</body>
</html>
