<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records – About</title>

  <!-- SEO loader: henter data fra JSON og setter meta-tags -->
  <script src="js/seo.js" defer data-seo="/content/seo/about.json"></script>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Hero image with title -->
  <div class="page-hero">
    <img class="hero-image" src="uploads/okplus_bjorvika.jpg" alt="Image of OkPlus in front of a city landscape"/>
    <h1>About</h1>
  </div>

  <!-- Main content -->
  <main class="page-content">
    <div id="about-content">Loading content...</div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-logo">
      <img src="uploads/OysterdaleRecords_white_logo.png" alt="Oysterdale Records Logo" class="footer-logo-img">
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <!-- Header & nav script -->
  <script>
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.body.insertAdjacentHTML('afterbegin', html);

        const toggleButton = document.getElementById('menu-toggle');
        const nav = document.querySelector('.main-nav');
        const navLinks = document.querySelectorAll('.main-nav a');

        if (toggleButton && nav) {
          toggleButton.addEventListener('click', () => {
            nav.classList.toggle('open');
            toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
          });
          navLinks.forEach(link => {
            link.addEventListener('click', () => {
              if (nav.classList.contains('open')) {
                nav.classList.remove('open');
                toggleButton.textContent = '☰';
              }
            });
          });
        }
      });

    fetch('content/about.md')
      .then(res => res.text())
      .then(md => {
        document.getElementById('about-content').innerHTML = marked.parse(md);
      });
  </script>
</body>
</html>
