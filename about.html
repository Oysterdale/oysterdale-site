<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- SEO -->
  <title>About — Oysterdale Records</title>
  <link rel="canonical" href="https://oysterdalerecords.com/about">
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <meta name="description" content="About Oysterdale Records — house & disco label from Oslo. ‘Every Record Is a Pearl’." />
  <meta property="og:site_name" content="Oysterdale Records" />
  <meta property="og:title" content="About — Oysterdale Records" />
  <meta property="og:description" content="House & disco label from Oslo. ‘Every Record Is a Pearl’." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://oysterdalerecords.com/about" />
  <meta property="og:image" content="uploads/og-about.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="About — Oysterdale Records" />
  <meta name="twitter:description" content="House & disco label from Oslo. ‘Every Record Is a Pearl’." />
  <meta name="twitter:image" content="uploads/og-about.jpg" />
  <!-- /SEO -->

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="page-content">
    <h1 class="page-title">About</h1>
    <div id="about-content" class="document-container">Loading…</div>
  </main>

  <footer>
    <div class="footer-logo">
      <img src="uploads/OysterdaleRecords_white_logo.png" alt="Oysterdale Records Logo" class="footer-logo-img">
    </div>
    <p>&copy; <span id="year"></span> Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    fetch("header.html").then(r => r.text()).then(html => {
      document.getElementById("site-header").innerHTML = html;
      const btn = document.getElementById("menu-toggle");
      if (btn) btn.addEventListener("click", () => document.body.classList.toggle("nav-open"));
    });

    fetch("content/about.md")
      .then(r => r.text())
      .then(md => { document.getElementById("about-content").innerHTML = marked.parse(md); })
      .catch(() => { document.getElementById("about-content").textContent = "Content failed to load."; });

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
