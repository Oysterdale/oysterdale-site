<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Header settes inn dynamisk (beholder din nåværende) -->
  <script>
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.body.insertAdjacentHTML('afterbegin', html);
        const toggleButton = document.getElementById('menu-toggle');
        const nav = document.querySelector('.main-nav');
        const navLinks = document.querySelectorAll('.main-nav a');
        if (toggleButton && nav) {
          toggleButton.addEventListener('click', () => {
            nav.classList.toggle('open');
            toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
          });
          navLinks.forEach(link => {
            link.addEventListener('click', () => {
              if (nav.classList.contains('open')) {
                nav.classList.remove('open');
                toggleButton.textContent = '☰';
              }
            });
          });
        }
      });
  </script>

  <!-- Hero/logo-bilde – som før, styres av .hero i styles.css -->
  <div class="hero" aria-hidden="true"></div>

  <main class="page-content">
    <!-- Intro fra markdown (som før) -->
    <div id="home-content">Loading content...</div>

    <!-- Spotify: beholder din originale spilleliste -->
    <section class="spotify-embed" style="margin-top:18px; display:flex; justify-content:center;">
      <iframe style="border-radius:12px"
        src="https://open.spotify.com/embed/playlist/1euFegx110KGHeMkYOam6e?utm_source=generator"
        width="100%" height="352" frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>
    </section>

    <!-- HIDDEN PEARL – lagt tilbake nederst på forsiden -->
    <section style="margin:40px auto 10px; max-width:740px; text-align:center; opacity:.85;">
      <p><em>You found a hidden pearl.</em></p>
    </section>
  </main>

  <footer>
    <div class="footer-logo">
      <img src="uploads/OysterdaleRecords_white_logo.png" alt="Oysterdale Records Logo" class="footer-logo-img">
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    // last inn forsiden-teksten fra markdown (samme som før)
    fetch('content/index.md')
      .then(res => res.text())
      .then(md => { document.getElementById('home-content').innerHTML = marked.parse(md); });
  </script>
</body>
</html>
