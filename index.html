<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records</title>

  <link rel="icon" href="images/favicon.png" type="image/png" />

  <!-- Vanlig, stabil lasting av CSS (ingen onload-hack) -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Font Awesome (normal link). NB: ikke @import i styles.css (tar vi etterpå) -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin>

  <!-- SEO + Marked (defer = ikke render-blokkerende) -->
  <script src="js/seo.js" defer data-seo="/content/seo/index.json"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

  <!-- Kun litt hjelpecss for skeleton (ufarlig) -->
  <style>
    .intro-section{max-width:800px;margin:2rem auto;padding:0 1rem;color:white}
    .spotify-embed{margin-top:2rem;display:flex;justify-content:center}
    .spotify-embed iframe{width:100%;max-width:600px;height:600px;border-radius:12px}
    @media (max-width:768px){.spotify-embed iframe{height:500px}}
    .skeleton{background:linear-gradient(90deg,#111 25%,#1a1a1a 37%,#111 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px}
    @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  </style>
</head>
<body>

  <!-- Header inline (identisk utseende) -->
  <header class="site-header">
    <div class="logo-title">
      <a href="index.html">
        <img
          src="/.netlify/images?url=/images/oysterdale-logo.png&w=220&h=60&fit=contain&fm=webp&q=74"
          alt="Oysterdale Records Logo"
          class="logo-img"
          width="220" height="60"
        >
      </a>
    </div>

    <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">☰</button>

    <nav class="main-nav">
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="releases.html">Releases</a>
        <a href="artists.html">Artists</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="social-icons">
        <a href="https://www.instagram.com/oysterdalerecords/" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://www.tiktok.com/@oysterdalerecords" target="_blank" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        <a href="https://www.youtube.com/@OysterdaleRecords" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        <a href="https://open.spotify.com/user/312r3ae6wsblyvtxnq6p5d7am" target="_blank" aria-label="Spotify"><i class="fab fa-spotify"></i></a>
        <a href="https://www.twitch.tv/oysterdalerecords" target="_blank" aria-label="Twitch"><i class="fab fa-twitch"></i></a>
        <a href="https://soundcloud.com/oysterdale-records" target="_blank" aria-label="SoundCloud"><i class="fab fa-soundcloud"></i></a>
        <a href="https://www.mixcloud.com/OysterdaleRecords/" target="_blank" aria-label="Mixcloud"><i class="fab fa-mixcloud"></i></a>
      </div>
    </nav>
  </header>

  <!-- HERO (samme bilde/URL som før, men med fetchpriority) -->
  <div class="home-hero">
    <img
      id="home-hero"
      class="hero-image"
      src="/.netlify/images?url=/images/forsidebilde.png&w=1200&fm=webp&q=55&fit=cover"
      srcset="
        /.netlify/images?url=/images/forsidebilde.png&w=360&fm=webp&q=55&fit=cover 360w,
        /.netlify/images?url=/images/forsidebilde.png&w=414&fm=webp&q=55&fit=cover 414w,
        /.netlify/images?url=/images/forsidebilde.png&w=428&fm=webp&q=55&fit=cover 428w,
        /.netlify/images?url=/images/forsidebilde.png&w=480&fm=webp&q=55&fit=cover 480w,
        /.netlify/images?url=/images/forsidebilde.png&w=640&fm=webp&q=55&fit=cover 640w,
        /.netlify/images?url=/images/forsidebilde.png&w=750&fm=webp&q=55&fit=cover 750w,
        /.netlify/images?url=/images/forsidebilde.png&w=828&fm=webp&q=55&fit=cover 828w,
        /.netlify/images?url=/images/forsidebilde.png&w=1024&fm=webp&q=55&fit=cover 1024w,
        /.netlify/images?url=/images/forsidebilde.png&w=1200&fm=webp&q=55&fit=cover 1200w,
        /.netlify/images?url=/images/forsidebilde.png&w=1280&fm=webp&q=55&fit=cover 1280w,
        /.netlify/images?url=/images/forsidebilde.png&w=1366&fm=webp&q=55&fit=cover 1366w
      "
      sizes="100vw"
      alt="Oysterdale Records hero image"
      fetchpriority="high"
      decoding="async"
      loading="eager"
    />
  </div>

  <main class="page-content">
    <!-- Fallback-tekst (erstattes av markdown når den er klar) -->
    <section id="home-content">
      <div class="skeleton" style="height:14px;width:55%;margin:12px 0;"></div>
      <div class="skeleton" style="height:14px;width:72%;margin:12px 0;"></div>
      <div class="skeleton" style="height:14px;width:64%;margin:12px 0;"></div>
    </section>

    <section class="intro-section">
      <div class="spotify-embed">
        <iframe
          title="Oysterdale Records – Spotify-playliste"
          src="https://open.spotify.com/embed/playlist/1euFegx110KGHeMkYOam6e?utm_source=generator"
          width="100%"
          height="352"
          frameborder="0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </div>
    </section>
  </main>

  <footer>
    <a href="https://on.soundcloud.com/rVdOdUhqw6MG3IcPRs">
      <img
        src="/.netlify/images?url=/images/pearl.png&w=100&h=100&fit=cover&fm=webp&q=74"
        alt="An image of a pearl"
        class="footer-pearl"
        width="100" height="100"
      />
    </a>
    <p><b><em>YOU FOUND A HIDDEN PEARL</em></b></p>

    <div class="footer-logo">
      <img
        src="/.netlify/images?url=/uploads/OysterdaleRecords_white_logo.png&w=260&h=260&fit=contain&fm=webp&q=74"
        alt="Oysterdale Records Logo"
        class="footer-logo-img"
        width="260" height="260"
      />
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <!-- Meny (mobil) -->
  <script>
    (function(){
      const toggleButton=document.getElementById('menu-toggle');
      const nav=document.querySelector('.main-nav');
      const navLinks=document.querySelectorAll('.main-nav a');
      if(toggleButton&&nav){
        toggleButton.addEventListener('click', ()=>{
          nav.classList.toggle('open');
          toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
        });
        navLinks.forEach(link=>{
          link.addEventListener('click', ()=>{
            if(nav.classList.contains('open')){
              nav.classList.remove('open'); toggleButton.textContent='☰';
            }
          });
        });
      }
    })();
  </script>

  <!-- Markdown: last inn når seksjonen er i nærheten -->
  <script>
    function stripFrontmatter(text){
      const fm=/^\s*---\s*\n[\s\S]*?\n---\s*\n?/;
      return text.replace(fm,'');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const target = document.querySelector('#home-content');
      if (!('IntersectionObserver' in window) || !target) {
        (window.requestIdleCallback || function(cb){setTimeout(cb,2000)})(function(){
          fetch('/content/index.md', { cache: 'force-cache' })
            .then(res=>res.ok ? res.text() : '')
            .then(md=>{ if(md && window.marked) target.innerHTML = marked.parse(stripFrontmatter(md)); })
            .catch(()=>{});
        });
        return;
      }

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            fetch('/content/index.md', { cache: 'force-cache' })
              .then(res=>res.ok ? res.text() : '')
              .then(md=>{
                if (!md || !window.marked) return;
                target.innerHTML = marked.parse(stripFrontmatter(md));
              })
              .catch(()=>{});
            observer.disconnect();
          }
        });
      }, { rootMargin: '200px' });

      observer.observe(target);
    });
  </script>

  <script src="js/hero.js" defer></script>
</body>
</html>
