  <script>
  (function(){
    function loadFooter(){
      fetch('/content/settings/footer.json', {cache:'no-store'})
        .then(r => r.json())
        .then(cfg => {
          const w = Number(cfg.width) || 260;
          const logoSrc = cfg.logo
            ? `/.netlify/images?url=${encodeURIComponent(cfg.logo)}&w=${w}&h=${w}&fit=contain&fm=webp&q=80`
            : '/uploads/OysterdaleRecords_white_logo_260.webp';
          const linksHtml = (cfg.links && cfg.links.length)
            ? `<nav class="footer-nav">${cfg.links.map(l => `<a href="${l.href}">${l.label}</a>`).join(" | ")}</nav>`
            : "";
          const html = `
            <footer>
              <div class="footer-logo">
                <img
                  src="${logoSrc}"
                  alt="Oysterdale Records Logo"
                  class="footer-logo-img"
                  width="${w}" height="${w}"
                  loading="lazy" decoding="async"
                >
              </div>
              <p>${cfg.text || '© 2025 Oysterdale Records. All rights reserved.'}</p>
              ${linksHtml}
            </footer>`;
          document.body.insertAdjacentHTML('beforeend', html);
        })
        .catch(e => console.error('Footer load failed', e));
    }
    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadFooter, { timeout: 3000 });
    } else {
      window.addEventListener('load', loadFooter);
    }
  })();
  </script>

  <!-- Meny -->
  <script>
    (function(){
      const toggleButton=document.getElementById('menu-toggle');
      const nav=document.querySelector('.main-nav');
      const navLinks=document.querySelectorAll('.main-nav a');
      if(toggleButton&&nav){
        toggleButton.addEventListener('click', ()=>{
          nav.classList.toggle('open');
          toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
        });
        navLinks.forEach(link=>{
          link.addEventListener('click', ()=>{
            if(nav.classList.contains('open')){
              nav.classList.remove('open'); toggleButton.textContent='☰';
            }
          });
        });
      }
    })();
  </script>

  <!-- Markdown (intro-tekst) -->
  <script>
    function stripFrontmatter(text){
      const fm=/^\s*---\s*\n[\s\S]*?\n---\s*\n?/;
      return text.replace(fm,'');
    }
    document.addEventListener('DOMContentLoaded', () => {
      const target = document.querySelector('#home-content');
      if (!target) return;
      fetch('/content/index.md', { cache: 'force-cache' })
        .then(res=>res.ok ? res.text() : '')
        .then(md=>{ if(md) target.innerHTML = marked.parse(stripFrontmatter(md)); })
        .catch(()=>{});
    });
  </script>

  <!-- Latest Release loader -->
  <script>
    (function(){
      const OWNER="Oysterdale", REPO="oysterdale-site", DIR="releases";

      function clean(v){
        return (v ?? "").toString().trim()
          .replace(/^"(.*)"$/,'$1')
          .replace(/^'(.*)'$/,'$1');
      }
      function hasValue(v){
        const s = clean(v);
        return !!s && !/^(-+|—+|none|n\/a)$/i.test(s);
      }
      function niceDate(iso){
        if(!iso) return "";
        const d=new Date(iso);
        return isNaN(d)?iso:d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
      }
      function parseFrontmatter(md){
        const parts = md.split('---');
        if (parts.length < 3) return { data:{}, body: md };
        const yaml = parts[1], body = parts.slice(2).join('---').trim();
        const data = {};
        yaml.split(/\r?\n/).forEach(line=>{
          const m=line.match(/^([^:]+):\s*(.*)$/);
          if(m){
            let v = m[2].trim().replace(/^"(.*)"$/,'$1');
            data[m[1].trim()] = v;
          }
        });
        return { data, body };
      }

      const IMG_PLATFORMS = new Set(["deezer","tidal","beatport","traxsource","itunes"]);
      const ICONS = {
        spotify:"fa-brands fa-spotify",
        apple:"fa-brands fa-apple",
        youtube:"fa-brands fa-youtube",
        ytmusic:"fa-brands fa-youtube",
        amazon:"fa-brands fa-amazon",
        bandcamp:"fa-brands fa-bandcamp",
        soundcloud:"fa-brands fa-soundcloud",
        itunes:"", deezer:"", tidal:"", beatport:"", traxsource:""
      };
      function platformButton(key,url){
        const u = clean(url);
        if(!u) return "";
        if(IMG_PLATFORMS.has(key)){
          const file = key === "itunes" ? "itunes" : key;
          return `<a href="${u}" target="_blank" rel="noopener"><img src="images/platforms/${file}.svg" alt="${key}"></a>`;
        }
        const cls = ICONS[key];
        return cls ? `<a href="${u}" target="_blank" rel="noopener" aria-label="${key}"><i class="${cls}"></i></a>` : "";
      }

      async function fetchLatest(){
        try{
          const listRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`);
          if(!listRes.ok) throw new Error("GitHub list failed");
          const files = (await listRes.json()).filter(f => f.type==="file" && f.name.endsWith(".md"));

          // hent alle, finn nyeste dato
          const entries = await Promise.all(files.map(async f=>{
            const md = await fetch(f.download_url).then(r=>r.text());
            const {data} = parseFrontmatter(md);
            const date = data.date ? new Date(clean(data.date)) : new Date(0);
            return { data, date };
          }));

          if(!entries.length) return null;
          entries.sort((a,b)=>b.date - a.date);
          return entries[0].data;
        }catch(e){
          console.error(e);
          return null;
        }
      }

      function renderLatest(data){
        const wrap = document.getElementById('latest-release');
        if(!wrap) return;

        if(!data){ wrap.innerHTML = "<p>Could not load latest release.</p>"; return; }

        const title   = clean(data.title);
        const artists = clean(data.artists || data.artist);
        const featRaw = clean(data.featured || data.feat);
        const featured = hasValue(featRaw) ? featRaw : "";
        const cover   = clean(data.cover || data.image);
        const dateStr = clean(data.date);

        const PLATFORMS = ["spotify","apple","itunes","deezer","amazon","youtube","ytmusic","tidal","beatport","traxsource","bandcamp","soundcloud"];
        const links = PLATFORMS.map(k => platformButton(k, data[k])).filter(Boolean).join("");
        const coverHref = PLATFORMS.map(k => clean(data[k])).find(Boolean) || "";

        wrap.innerHTML = `
          <div class="release latest">
            <div class="release-content">
              <div class="release-header">
                ${artists ? `<h2 class="release-artist">${artists}</h2>` : ""}
                ${title   ? `<h3 class="release-title">${title}</h3>` : ""}
                ${featured? `<p class="release-featured">feat. ${featured}</p>` : ""}
              </div>
              ${cover ? `
                ${coverHref ? `<a href="${coverHref}" target="_blank" rel="noopener">` : ``}
                  <img src="${cover}" alt="${title}" class="release-cover">
                ${coverHref ? `</a>` : ``}
              ` : ""}
              <div class="platform-icons">${links}</div>
              ${dateStr ? `<p class="release-date">Release date: ${niceDate(dateStr)}</p>` : ""}
            </div>
          </div>
        `;
      }

      document.addEventListener('DOMContentLoaded', async ()=>{
        const latest = await fetchLatest();
        renderLatest(latest);
      });
    })();
  </script>
