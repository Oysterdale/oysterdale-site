<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records</title>

  <script src="js/seo.js" defer data-seo="/content/seo/index.json"></script>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .intro-section{max-width:800px;margin:2rem auto;padding:0 1rem;color:white}
    .spotify-embed{margin-top:2rem;display:flex;justify-content:center}
    .spotify-embed iframe{width:100%;max-width:600px;height:600px;border-radius:12px}
    @media (max-width:768px){.spotify-embed iframe{height:500px}}
  </style>
</head>
<body>

  <div class="home-hero">
    <!-- Hero via Netlify Image CDN (webp + kompresjon + flere breakpoints) -->
    <img
      id="home-hero"
      class="hero-image"
      src="/.netlify/images?url=/images/forsidebilde.png&w=1366&fm=webp&q=74&fit=cover"
      srcset="
        /.netlify/images?url=/images/forsidebilde.png&w=480&fm=webp&q=74&fit=cover 480w,
        /.netlify/images?url=/images/forsidebilde.png&w=768&fm=webp&q=74&fit=cover 768w,
        /.netlify/images?url=/images/forsidebilde.png&w=1024&fm=webp&q=74&fit=cover 1024w,
        /.netlify/images?url=/images/forsidebilde.png&w=1280&fm=webp&q=74&fit=cover 1280w,
        /.netlify/images?url=/images/forsidebilde.png&w=1366&fm=webp&q=74&fit=cover 1366w,
        /.netlify/images?url=/images/forsidebilde.png&w=1440&fm=webp&q=74&fit=cover 1440w,
        /.netlify/images?url=/images/forsidebilde.png&w=1600&fm=webp&q=74&fit=cover 1600w
      "
      sizes="100vw"
      data-fallback="/.netlify/images?url=/images/forsidebilde.png&w=1366&fm=webp&q=74&fit=cover"
      alt="Oysterdale Records hero image"
      fetchpriority="high"
    />
  </div>

  <main class="page-content">
    <div id="home-content">Loading content...</div>

    <section class="intro-section">
      <div class="spotify-embed">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/1euFegx110KGHeMkYOam6e?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>
    </section>
  </main>

  <footer>
    <br><br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br><br>
    <a href="https://on.soundcloud.com/rVdOdUhqw6MG3IcPRs">
      <!-- Pearl (vises ~100x100) -->
      <img
        src="/.netlify/images?url=/images/pearl.png&w=100&h=100&fit=cover&fm=webp&q=74"
        alt="An image of a pearl"
        class="footer-pearl"
        width="100" height="100"
      />
    </a>
    <p><b><em>YOU FOUND A HIDDEN PEARL</em></b></p>

    <div class="footer-logo">
      <!-- Footer-logo (vises ~260x260) -->
      <img
        src="/.netlify/images?url=/uploads/OysterdaleRecords_white_logo.png&w=260&h=260&fit=contain&fm=webp&q=74"
        alt="Oysterdale Records Logo"
        class="footer-logo-img"
        width="260" height="260"
      />
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    fetch('header.html').then(res=>res.text()).then(html=>{
      document.body.insertAdjacentHTML('afterbegin', html);
      const toggleButton=document.getElementById('menu-toggle');
      const nav=document.querySelector('.main-nav');
      const navLinks=document.querySelectorAll('.main-nav a');
      if(toggleButton&&nav){
        toggleButton.addEventListener('click', ()=>{
          nav.classList.toggle('open');
          toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
        });
        navLinks.forEach(link=>{
          link.addEventListener('click', ()=>{
            if(nav.classList.contains('open')){
              nav.classList.remove('open'); toggleButton.textContent='☰';
            }
          });
        });
      }
    });

    function stripFrontmatter(text){
      const fm=/^\s*---\s*\n[\s\S]*?\n---\s*\n?/;
      return text.replace(fm,'');
    }
    fetch('content/index.md')
      .then(res=>res.text())
      .then(md=>{ document.getElementById('home-content').innerHTML = marked.parse(stripFrontmatter(md)); })
      .catch(err=>console.error('Index markdown load error:', err));
  </script>

  <script src="js/hero.js" defer></script>
</body>
</html>
