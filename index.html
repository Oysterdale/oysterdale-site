<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records</title>

  <!-- Preload LCP hero image -->
  <link
    rel="preload"
    as="image"
    href="/.netlify/images?url=/images/forsidebilde.png&w=1200&fm=webp&q=55&fit=cover"
    imagesrcset="
      /.netlify/images?url=/images/forsidebilde.png&w=360&fm=webp&q=55&fit=cover 360w,
      /.netlify/images?url=/images/forsidebilde.png&w=414&fm=webp&q=55&fit=cover 414w,
      /.netlify/images?url=/images/forsidebilde.png&w=428&fm=webp&q=55&fit=cover 428w,
      /.netlify/images?url=/images/forsidebilde.png&w=640&fm=webp&q=55&fit=cover 640w,
      /.netlify/images?url=/images/forsidebilde.png&w=1024&fm=webp&q=55&fit=cover 1024w,
      /.netlify/images?url=/images/forsidebilde.png&w=1200&fm=webp&q=55&fit=cover 1200w
    "
    imagesizes="100vw"
  />

  <!-- Preconnect til eksterne kilder -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Preload fetch-ressurser (unngå request chain) -->
  <link rel="preload" href="/header.html" as="fetch" crossorigin>
  <link rel="preload" href="/content/index.md" as="fetch" crossorigin>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin>

  <!-- SEO runtime -->
  <script src="js/seo.js" defer data-seo="/content/seo/index.json"></script>
  <!-- Marked -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
</head>
<body>
  <!-- Header lastes dynamisk -->
  <div id="header-placeholder"></div>

  <!-- HERO -->
  <div class="home-hero">
    <img
      id="home-hero"
      class="hero-image"
      src="/.netlify/images?url=/images/forsidebilde.png&w=1200&fm=webp&q=55&fit=cover"
      srcset="
        /.netlify/images?url=/images/forsidebilde.png&w=360&fm=webp&q=55&fit=cover 360w,
        /.netlify/images?url=/images/forsidebilde.png&w=414&fm=webp&q=55&fit=cover 414w,
        /.netlify/images?url=/images/forsidebilde.png&w=428&fm=webp&q=55&fit=cover 428w,
        /.netlify/images?url=/images/forsidebilde.png&w=640&fm=webp&q=55&fit=cover 640w,
        /.netlify/images?url=/images/forsidebilde.png&w=1024&fm=webp&q=55&fit=cover 1024w,
        /.netlify/images?url=/images/forsidebilde.png&w=1200&fm=webp&q=55&fit=cover 1200w
      "
      sizes="100vw"
      alt="Oysterdale Records hero image"
      fetchpriority="high"
    />
  </div>

  <!-- MAIN CONTENT -->
  <main class="page-content">
    <section id="home-content">
      <!-- Skeleton fallback -->
      <div class="skeleton" style="height:14px;width:55%;margin:12px 0;"></div>
      <div class="skeleton" style="height:14px;width:72%;margin:12px 0;"></div>
      <div class="skeleton" style="height:14px;width:64%;margin:12px 0;"></div>
    </section>

    <section class="intro-section">
      <div class="spotify-embed">
        <iframe
          title="Oysterdale Records – Spotify-playliste"
          src="https://open.spotify.com/embed/playlist/1euFegx110KGHeMkYOam6e?utm_source=generator"
          width="100%"
          height="352"
          frameborder="0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <a href="https://on.soundcloud.com/rVdOdUhqw6MG3IcPRs">
      <img
        src="/.netlify/images?url=/images/pearl.png&w=100&h=100&fit=cover&fm=webp&q=74"
        alt="An image of a pearl"
        class="footer-pearl"
        width="100" height="100"
      />
    </a>
    <p><b><em>YOU FOUND A HIDDEN PEARL</em></b></p>
    <div class="footer-logo">
      <img
        src="/.netlify/images?url=/uploads/OysterdaleRecords_white_logo.png&w=260&h=260&fit=contain&fm=webp&q=74"
        alt="Oysterdale Records Logo"
        class="footer-logo-img"
        width="260" height="260"
      />
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <!-- SCRIPT: Header + menu + markdown -->
  <script>
    // Polyfill
    window.requestIdleCallback = window.requestIdleCallback || function(cb){ setTimeout(cb, 1); };

    document.addEventListener('DOMContentLoaded', () => {
      // HEADER
      fetch('/header.html')
        .then(r => r.text())
        .then(html => {
          document.getElementById('header-placeholder').innerHTML = html;
          const btn = document.getElementById('menu-toggle');
          const nav = document.querySelector('.main-nav');
          if (btn && nav) {
            btn.addEventListener('click', () => {
              const open = nav.classList.toggle('open');
              btn.textContent = open ? '✖' : '☰';
            });
          }
        });

      // MARKDOWN (idle)
      requestIdleCallback(() => {
        const target = document.querySelector('#home-content');
        fetch('/content/index.md')
          .then(r => r.text())
          .then(md => {
            if (window.marked) {
              const fm=/^\s*---\s*\n[\s\S]*?\n---\s*\n?/;
              target.innerHTML = marked.parse(md.replace(fm,''));
            }
          });
      });
    });
  </script>

  <script src="js/hero.js" defer></script>
</body>
</html>
