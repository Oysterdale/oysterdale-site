<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- SEO -->
  <title>Oysterdale Records — Every Record Is a Pearl</title>
  <link rel="canonical" href="https://oysterdalerecords.com/">
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <meta name="description" content="Independent house & disco label from Oslo. Monthly releases. Vinyl & digital." />
  <meta name="keywords" content="Oysterdale Records, OKPLUS, house, disco, Oslo, label" />
  <meta property="og:site_name" content="Oysterdale Records" />
  <meta property="og:title" content="Oysterdale Records — Every Record Is a Pearl" />
  <meta property="og:description" content="Independent house & disco label from Oslo. Monthly releases. Vinyl & digital." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://oysterdalerecords.com/" />
  <meta property="og:image" content="uploads/og-home.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@OysterdaleRecs" />
  <meta name="twitter:title" content="Oysterdale Records — Every Record Is a Pearl" />
  <meta name="twitter:description" content="Independent house & disco label from Oslo. Monthly releases. Vinyl & digital." />
  <meta name="twitter:image" content="uploads/og-home.jpg" />
  <!-- /SEO -->

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <!-- Header (shared) -->
  <div id="site-header"></div>

  <main class="page-content">
    <div id="home-content" class="document-container">Loading…</div>

    <!-- Optional: Spotify embed (kept like før) -->
    <section class="spotify-embed" style="display:flex;justify-content:center;margin:2rem 0;">
      <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DX0BcQWzuB7ZO?utm_source=generator" width="100%" height="352" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </section>
  </main>

  <footer>
    <div class="footer-logo">
      <img src="uploads/OysterdaleRecords_white_logo.png" alt="Oysterdale Records Logo" class="footer-logo-img">
    </div>
    <p>&copy; <span id="year"></span> Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    // Inject shared header
    fetch("header.html").then(r => r.text()).then(html => {
      document.getElementById("site-header").innerHTML = html;
      const btn = document.getElementById("menu-toggle");
      if (btn) btn.addEventListener("click", () => document.body.classList.toggle("nav-open"));
    });

    // Load markdown content for home
    fetch("content/index.md")
      .then(r => r.text())
      .then(md => { document.getElementById("home-content").innerHTML = marked.parse(md); })
      .catch(() => { document.getElementById("home-content").textContent = "Content failed to load."; });

    // Year in footer
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
