    .spotify-grid{margin:2rem auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem;max-width:1000px;padding:0 1rem}

    .skeleton{background:linear-gradient(90deg,#111 25%,#1a1a1a 37%,#111 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px}

<body>

  <!-- HEADER -->

    <nav class="main-nav">

  <!-- HERO -->
  <div class="home-hero">
    <img id="home-hero" class="hero-image"
         src="/.netlify/images?url=/images/forsidebilde.png&w=1200&fm=webp&q=55&fit=cover"
         alt="Oysterdale Records hero image">
  </div>

  <main class="page-content">
    <!-- Tekst (fra index.md) -->
    <div id="home-content">
      <div class="skeleton" style="height:14px;width:55%;margin:12px 0;"></div>
    </div>

    <!-- Spotify playlists (fra admin) -->
    <section id="spotify-section" style="display:none;">
      <h2 style="text-align:center; margin-bottom:1rem;">Playlists</h2>

    <!-- Latest Release -->

    <img src="/.netlify/images?url=/uploads/OysterdaleRecords_white_logo.png&w=260&h=260&fit=contain&fm=webp&q=74"
         alt="Oysterdale Records Logo" width="260" height="260">
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <!-- MENU -->
  <script>
    (function(){
      const btn=document.getElementById('menu-toggle'), nav=document.querySelector('.main-nav');
      if(btn&&nav){
        btn.addEventListener('click',()=>{
          nav.classList.toggle('open');
          btn.textContent=nav.classList.contains('open')?'✖':'☰';
        });
      }
    })();
  </script>

  <!-- Load index.md (tekst + spotify) -->
  <script>
    async function loadHomeContent(){
      try {
        const res = await fetch('/content/index.md',{cache:'no-store'});
        const md = await res.text();
        const parts = md.split('---');
        let fm={}, body=md;
        if(parts.length>=3){
          const yaml=parts[1]; body=parts.slice(2).join('---').trim();
          yaml.split(/\r?\n/).forEach(line=>{
            const m=line.match(/^([^:]+):\s*(.*)$/);
            if(m){fm[m[1].trim()]=m[2].trim().replace(/^"(.*)"$/,"$1");}
          });
        }
        document.getElementById('home-content').innerHTML = marked.parse(body);

        // Spotify-lister
        if(fm.spotify_playlists){
          try{
            const playlists=JSON.parse(fm.spotify_playlists);
            if(Array.isArray(playlists)&&playlists.length){
              const grid=document.getElementById('spotify-grid');
              grid.innerHTML=playlists.map(p=>`
                <div class="spotify-card">
                  ${p.title?`<h3 style="text-align:center;margin-bottom:0.5rem;">${p.title}</h3>`:""}
                  <iframe src="${p.embed}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
                </div>`).join('');
              document.getElementById('spotify-section').style.display='block';
            }
          }catch(e){console.warn("Spotify parse failed",e);}
        }
      } catch(e){console.error("Home load failed",e);}
    }
    document.addEventListener('DOMContentLoaded',loadHomeContent);
  </script>

  <!-- Latest Release -->
  <script>
    (function(){
      const OWNER="Oysterdale", REPO="oysterdale-site", DIR="releases";
      function niceDate(iso){const d=new Date(iso);return isNaN(d)?iso:d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}
      function parseFM(md){const parts=md.split('---');if(parts.length<3)return{data:{},body:md};const yaml=parts[1],data={};yaml.split(/\r?\n/).forEach(line=>{const m=line.match(/^([^:]+):\s*(.*)$/);if(m)data[m[1].trim()]=m[2].trim();});return{data};}
      async function fetchLatest(){const list=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`).then(r=>r.json());const files=list.filter(f=>f.name.endsWith(".md"));const entries=await Promise.all(files.map(async f=>{const md=await fetch(f.download_url).then(r=>r.text());const {data}=parseFM(md);return{data,date:new Date(data.date||0)};}));entries.sort((a,b)=>b.date-a.date);return entries[0]?.data;}
      function renderLatest(data){const wrap=document.getElementById('latest-release');if(!wrap)return;wrap.innerHTML=`
        <div class="release latest">
          ${data.artists?`<h2>${Array.isArray(data.artists)?data.artists.join(" | "):data.artists}</h2>`:""}
          ${data.title?`<h3>${data.title}</h3>`:""}
          ${data.cover?`<a href="/releases"><img src="${data.cover}" alt="${data.title} cover"></a>`:""}
          ${data.date?`<p>Release date: ${niceDate(data.date)}</p>`:""}
        </div>`;}
      document.addEventListener('DOMContentLoaded',async()=>{const latest=await fetchLatest();if(latest)renderLatest(latest);});
    })();
  </script>
</body>
</html>
