<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Oysterdale Records</title>

  <!-- SEO loader: henter data fra JSON og setter KUN meta-tags i <head> -->
  <script src="js/seo.js" defer data-seo="/content/seo/index.json"></script>

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* evt. små stilting her om du hadde det */
    .home-hero {
      background: linear-gradient(90deg, #b024ff 0%, #ff3d6e 100%);
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .home-hero img { max-width: 90%; height: auto; }
    .page-content { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; }
    .spotify-embed { margin: 2rem 0; }
  </style>
</head>
<body>

  <!-- Header settes inn dynamisk -->
  <div id="header-mount"></div>

  <div class="home-hero">
    <img src="images/hero_oysterdale.png" alt="Oysterdale Records Hero">
  </div>

  <main class="page-content">
    <div id="home-content">Loading content...</div>

    <section class="spotify-embed">
      <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/1euFegx110KGHeMkYOam6e?utm_source=generator"
        width="100%" height="352" frameborder="0" allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>
    </section>
  </main>

  <script>
    // Header-loader
    fetch("header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-mount").insertAdjacentHTML("afterbegin", html);
        const btn = document.getElementById("menu-toggle");
        const nav = document.querySelector(".main-nav");
        if (btn && nav) {
          const toggle = () => {
            const open = nav.classList.toggle("open");
            btn.textContent = open ? "✖" : "☰";
          };
          btn.addEventListener("click", toggle);
        }
      })
      .catch(err => console.error("Header load error:", err));

    // Hent markdown-innhold og STRIPP frontmatter før render
    function stripFrontmatter(text) {
      const fm = text.match(/^\s*---[\s\S]*?---\s*/);
      if (!fm) return text;
      return text.replace(fm, '');
    }

    fetch('content/index.md')
      .then(res => res.text())
      .then(md => {
        const clean = stripFrontmatter(md);
        document.getElementById('home-content').innerHTML = marked.parse(clean);
      })
      .catch(err => console.error('Index markdown load error:', err));
  </script>
</body>
</html>
