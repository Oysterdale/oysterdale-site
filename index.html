  <!-- Menu JS -->
  <script>
    (function(){
      const toggleButton=document.getElementById('menu-toggle');
      const nav=document.querySelector('.main-nav');
      const navLinks=document.querySelectorAll('.main-nav a');
      if(toggleButton&&nav){
        toggleButton.addEventListener('click', ()=>{
          nav.classList.toggle('open');
          toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
        });
        navLinks.forEach(link=>{
          link.addEventListener('click', ()=>{
            if(nav.classList.contains('open')){
              nav.classList.remove('open'); toggleButton.textContent='☰';
            }
          });
        });
      }
    })();
  </script>

  <!-- Markdown etter idle (ENESTE henting av content/index.md) -->
  <script>
    function stripFrontmatter(text){
      const fm=/^\s*---\s*\n[\s\S]*?\n---\s*\n?/;
      return text.replace(fm,'');
    }
    (window.requestIdleCallback || function(cb){setTimeout(cb,1)})(function(){
      fetch('content/index.md')
        .then(res=>res.text())
        .then(md=>{
          document.getElementById('home-content').innerHTML = marked.parse(stripFrontmatter(md));
        })
        .catch(err=>console.error('Index markdown load error:', err));
    });
  </script>
