  <!-- Inline tweaks + heading marquee + extras -->
  <style>
    .skeleton {
      background:linear-gradient(90deg,#111 25%,#1a1a1a 37%,#111 63%);
      background-size:400% 100%;
      animation:shimmer 1.4s ease infinite;
      border-radius:8px;
    }
    @keyframes shimmer {
      0%{background-position:100% 0}
      100%{background-position:-100% 0}
    }

    footer a { color:#fff; }
    footer a:hover { color:#bbb; }

    :root{
      --heading-marquee-gap: 3.5rem;
    }

    .scroll-title{
      position:relative;
      overflow:hidden;
      white-space:nowrap;
      letter-spacing:.02em;
    }

    .scroll-title[data-marquee="off"]{
      overflow:visible;
      white-space:normal;
    }

    .scroll-title .marquee-clip{
      display:block;
      overflow:hidden;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 8%, #000 92%, transparent 100%);
              mask-image: linear-gradient(to right, transparent 0, #000 8%, #000 92%, transparent 100%);
    }

    .scroll-title .marquee-track{
      display:inline-flex;
      align-items:baseline;
      gap:var(--heading-marquee-gap);
      will-change:transform;
      transform:translate3d(0,0,0);
    }

    .scroll-title{ --heading-marquee-duration: 14s; }

    .scroll-title.is-marquee-on .marquee-track{
      animation: marqueeMove var(--heading-marquee-duration) linear infinite;
    }

    @keyframes marqueeMove{
      0%   { transform:translate3d(0,0,0); }
      100% { transform:translate3d(-50%,0,0); }
    }

    @media (prefers-reduced-motion: reduce){
      .scroll-title.is-marquee-on .marquee-track{ animation:none; }
    }

    /* Extras under each heading (button + image) */
    .heading-extra{
      display:flex;
      gap:12px;
      align-items:center;
      margin: 10px 0 16px;
      flex-wrap: wrap;
    }

    .heading-extra-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.22);
      text-decoration:none;
      color:#fff;
      font-size:13px;
      font-weight:700;
      letter-spacing:.02em;
      transition: transform .12s ease, border-color .12s ease;
    }
    .heading-extra-btn:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.5);
    }

    .heading-extra-img{
      height: 38px;
      width: auto;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
    }

    /* Sections spacing */
    #home-sections { margin-top: 16px; }
    .home-section { margin: 26px 0; }
    .home-section .spotify-grid { margin-top: 14px; }
  </style>

  <!-- MOBILE MENU -->
  <script>
    (function(){
      const toggleButton=document.getElementById('menu-toggle');
      const nav=document.querySelector('.main-nav');
      const navLinks=document.querySelectorAll('.main-nav a');

      if(toggleButton&&nav){
        toggleButton.addEventListener('click', ()=>{
          nav.classList.toggle('open');
          toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
        });
        navLinks.forEach(link=>{
          link.addEventListener('click', ()=>{
            if(nav.classList.contains('open')){
              nav.classList.remove('open');
              toggleButton.textContent='☰';
            }
          });
        });
      }
    })();
  </script>

  <!-- HERO overlay logo source (admin via /data/home.json) -->
  <script>
    (function(){
      const logoEl = document.getElementById('hero-overlay-logo');
      if(!logoEl) return;

      const fallback = "/uploads/OysterdaleRecords_white_logo.png";

      function cdn(url, w){
        if(!url) return "";
        return `/.netlify/images?url=${url}&w=${w}&fm=webp&q=80&fit=contain`;
      }

      fetch("/data/home.json", { cache: "no-store" })
        .then(r => r.ok ? r.json() : {})
        .then(cfg => {
          const raw = (cfg && cfg.hero_logo) ? String(cfg.hero_logo).trim() : "";
          const src = raw || fallback;
          logoEl.src = cdn(src, 520);
        })
        .catch(() => {
          logoEl.src = cdn(fallback, 520);
        });
    })();
  </script>

  <!-- Markdown (intro only) -->
  <script>
    function stripFrontmatterBlock(text){
      const m = text.match(/^\s*---\s*[\r\n]+([\s\S]*?)\s*---\s*[\r\n]+/);
      return m ? text.slice(m[0].length) : text;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const heroTarget   = document.querySelector('#hero-content');
      const mobileTarget = document.querySelector('#home-content');

      fetch('/content/index.md', { cache: 'no-store' })
        .then(res => res.ok ? res.text() : '')
        .then(md => {
          if(!md) return;
          const body = stripFrontmatterBlock(md);
          const html = marked.parse(body);

          if(heroTarget) heroTarget.innerHTML = html;
          if(mobileTarget) mobileTarget.innerHTML = html;
        })
        .catch(()=>{});
    });
  </script>
