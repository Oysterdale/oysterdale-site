  <!-- Markdown + Frontmatter (hent tekst + spotify-lister) -->
  <script>
    function stripFrontmatterBlock(text){
      const m = text.match(/^\s*---\s*[\r\n]+([\s\S]*?)\s*---\s*[\r\n]+/);
      return m ? text.slice(m[0].length) : text;
    }

    // Minimal YAML-parser for akkurat det vi trenger (nøkler + lister + liste-objekter)
    function parseFrontmatter(text){
      const m = text.match(/^\s*---\s*[\r\n]+([\s\S]*?)\s*---\s*[\r\n]+/);
      if(!m) return {};
      const yaml = m[1];
      const lines = yaml.split(/\r?\n/);

      const root = {};
      let currentKey = null;
      let listMode = false;
      let currentItem = null;

      // very basic indentation-aware parse
      lines.forEach(raw=>{
        const line = raw.replace(/\t/g,'  ');
        if(!line.trim()) return;

        // toppnivå "key:"
        let mKey = line.match(/^([A-Za-z0-9_]+):\s*(.*)$/);
        if(mKey && !line.startsWith('  ')){ // root-level key
          const key = mKey[1].trim();
          const val = mKey[2].trim();
          if(val === '' ){ // kan være liste eller tom nøkkel
            root[key] = root[key] || null;
            currentKey = key;
            listMode = false;
            currentItem = null;
          } else {
            // enkel verdi
            root[key] = val.replace(/^"(.*)"$/,'$1');
            currentKey = key;
            listMode = false;
            currentItem = null;
          }
          return;
        }

        // element i liste: "  - ..." under gjeldende nøkkel
        let mList = line.match(/^\s{2}-\s*(.*)$/);
        if(mList && currentKey){
          if(!Array.isArray(root[currentKey])) root[currentKey] = [];
          const rest = mList[1];

          // "  - key: value" (starter objekt)
          const kv = rest.match(/^([A-Za-z0-9_]+):\s*(.*)$/);
          if(kv){
            currentItem = {};
            currentItem[kv[1]] = kv[2].replace(/^"(.*)"$/,'$1');
            root[currentKey].push(currentItem);
            listMode = true;
            return;
          }

          // "  - bare en streng"
          root[currentKey].push(rest.replace(/^"(.*)"$/,'$1'));
          listMode = true;
          currentItem = null;
          return;
        }

        // egenskap på forrige liste-objekt: "    key: value"
        let mChild = line.match(/^\s{4}([A-Za-z0-9_]+):\s*(.*)$/);
        if(mChild && listMode && currentItem){
          currentItem[mChild[1]] = mChild[2].replace(/^"(.*)"$/,'$1');
          return;
        }
      });

      return root;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const target = document.querySelector('#home-content');

      const loadIt = () => {
        fetch('/content/index.md', { cache: 'no-store' })
          .then(res => res.ok ? res.text() : '')
          .then(md => {
            if(!md) return;

            // Render body-tekst
            const body = stripFrontmatterBlock(md);
            if(target) target.innerHTML = marked.parse(body);

            // Parse frontmatter for spotify_playlists
            const fm = parseFrontmatter(md);
            const playlists = Array.isArray(fm.spotify_playlists) ? fm.spotify_playlists : [];

            if(playlists.length){
              const grid = document.getElementById('spotify-grid');
              const section = document.getElementById('spotify-section');
              grid.innerHTML = playlists.map(p => {
                const title = (p && (p.title || p['Title'])) || '';
                const embed = (p && (p.embed || p['Embed URL'] || p['embed_url'])) || '';
                return `
                  <div class="spotify-card">
                    ${title ? `<h3 style="text-align:center;margin-bottom:.5rem;">${title}</h3>` : ""}
                    ${embed ? `<iframe src="${embed}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>` : ""}
                  </div>
                `;
              }).join('');
              section.style.display = 'block';
            }
          })
          .catch(()=>{});
      };

      // Bruk IntersectionObserver som i din fil (lazyer litt)
      if (!('IntersectionObserver' in window) || !target) {
        (window.requestIdleCallback || function(cb){setTimeout(cb,1200)})(loadIt);
      } else {
        const io = new IntersectionObserver(entries=>{
          entries.forEach(entry=>{
            if(entry.isIntersecting){ loadIt(); io.disconnect(); }
          });
        }, { rootMargin: '200px' });
        io.observe(target);
      }
    });
  </script>

  <!-- Latest Release (fra /releases, sortert på dato) -->
  <script>
    (function(){
      const OWNER="Oysterdale", REPO="oysterdale-site", DIR="releases";

      function clean(v){ return (v??"").toString().trim(); }
      function niceDate(iso){
        if(!iso) return "";
        const d=new Date(iso);
        return isNaN(d)?iso:d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
      }

      // enkel FM-parser (nok for releases)
      function parseFM(md){
        const m = md.match(/^\s*---\s*[\r\n]+([\s\S]*?)\s*---\s*/);
        const data = {};
        if(!m) return data;
        const yaml = m[1].replace(/\t/g,'  ');
        const lines = yaml.split(/\r?\n/);

        let key = null, inList = false, currentItem = null;

        lines.forEach(raw=>{
          const line = raw;
          if(!line.trim()) return;

          // root key
          const rootKey = line.match(/^([A-Za-z0-9_]+):\s*(.*)$/);
          if(rootKey && !line.startsWith('  ')){
            key = rootKey[1];
            const val = rootKey[2].trim();
            if(val===''){
              data[key] = data[key] ?? null;
              inList = false; currentItem = null;
            } else {
              data[key] = val.replace(/^"(.*)"$/,'$1');
              inList = false; currentItem = null;
            }
            return;
          }

          // list item under key
          const listItem = key && line.match(/^\s{2}-\s*(.*)$/);
          if(listItem){
            if(!Array.isArray(data[key])) data[key] = [];
            const rest = listItem[1];

            const kv = rest.match(/^([A-Za-z0-9_]+):\s*(.*)$/);
            if(kv){
              currentItem = {};
              currentItem[kv[1]] = kv[2].replace(/^"(.*)"$/,'$1');
              data[key].push(currentItem);
              inList = true;
            } else {
              data[key].push(rest.replace(/^"(.*)"$/,'$1'));
              currentItem = null; inList = true;
            }
            return;
          }

          // child props on list-object
          const child = inList && currentItem && line.match(/^\s{4}([A-Za-z0-9_]+):\s*(.*)$/);
          if(child){
            currentItem[child[1]] = child[2].replace(/^"(.*)"$/,'$1');
          }
        });

        return data;
      }

      function artistsToString(artists){
        if(Array.isArray(artists)){
          // enten ["A","B"] eller [{artist:"A"},{artist:"B"}]
          const names = artists.map(a => {
            if(typeof a === 'string') return a;
            if(a && typeof a === 'object') return a.artist || a.name || '';
            return '';
          }).filter(Boolean);
          return names.join(' | ');
        }
        return clean(artists);
      }

      async function fetchLatest(){
        const list = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`).then(r=>r.json());
        const files = Array.isArray(list) ? list.filter(f=>f.name.endsWith('.md')) : [];
        const entries = await Promise.all(files.map(async f=>{
          const md = await fetch(f.download_url).then(r=>r.text());
          const fm = parseFM(md);
          return {
            data: fm,
            date: new Date(fm.date || 0)
          };
        }));
        entries.sort((a,b)=>b.date-a.date);
        return entries[0]?.data;
      }

      function renderLatest(data){
        const wrap = document.getElementById('latest-release'); if(!wrap) return;
        const artistStr = artistsToString(data.artists || data.artist);
        wrap.innerHTML = `
          <div class="release latest">
            <div class="release-header">
              ${artistStr ? `<h2 class="release-artist">${artistStr}</h2>` : ``}
              ${data.title ? `<h3 class="release-title">${data.title}</h3>` : ``}
            </div>
            ${data.cover ? `<a href="/releases"><img src="${data.cover}" class="release-cover" alt="${(data.title||'Release')} cover"></a>` : ``}
            ${data.date ? `<p class="release-date">Release date: ${niceDate(data.date)}</p>` : ``}
          </div>
        `;
      }

      document.addEventListener('DOMContentLoaded', async ()=>{
        try{
          const latest = await fetchLatest();
          if(latest) renderLatest(latest);
        }catch(e){/* stille fail */ }
      });
    })();
  </script>
