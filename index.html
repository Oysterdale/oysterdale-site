<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oysterdale Records</title>

  <!-- Anti-FOUC -->
  <style>
    body.preload { opacity: 0; transition: opacity .18s ease; }
  </style>

  <!-- Preload hero -->
  <link
    rel="preload"
    as="image"
    href="/.netlify/images?url=/uploads/Oysterdale_forsidebilde_nettside_optimized.webp&w=1200&fm=webp&q=50&fit=cover"
    imagesrcset="
      /.netlify/images?url=/uploads/Oysterdale_forsidebilde_nettside_optimized.webp&w=360&fm=webp&q=50&fit=cover 360w,
      /.netlify/images?url=/uploads/Oysterdale_forsidebilde_nettside_optimized.webp&w=720&fm=webp&q=50&fit=cover 720w,
      /.netlify/images?url=/uploads/Oysterdale_forsidebilde_nettside_optimized.webp&w=1200&fm=webp&q=50&fit=cover 1200w
    "
    imagesizes="(min-width: 1280px) 1200px, 100vw"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Font Awesome -->
  <link rel="preload"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        as="style" crossorigin
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          crossorigin>
  </noscript>

  <link rel="icon" href="images/favicon.png" type="image/png" />

  <!-- Marked -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

  <!-- SEO runtime -->
  <script src="js/seo.js" defer data-seo="/content/seo/index.json"></script>

  <style>
    .intro-section{max-width:800px;margin:2rem auto;padding:0 1rem;color:white}
    .spotify-embed{margin-top:2rem;display:flex;justify-content:center}
    .spotify-embed iframe{width:100%;max-width:600px;height:600px;border-radius:12px}
    @media (max-width:768px){.spotify-embed iframe{height:500px}}
    .skeleton{background:linear-gradient(90deg,#111 25%,#1a1a1a 37%,#111 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px}
    @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
    .latest-wrap{max-width:820px;margin:1.5rem auto 0;padding:0 1rem}
    .latest-wrap h2{margin:0 0 .6rem}
    .release.latest {margin:1rem 0;max-width:820px}
  </style>
</head>
<body class="preload">

  <!-- HEADER -->
  <header class="site-header">
    <div class="logo-title">
      <a href="index.html" aria-label="Home">
        <img src="/.netlify/images?url=/images/oysterdale-logo.png&w=220&h=60&fit=contain&fm=webp&q=74"
             alt="Oysterdale Records Logo"
             class="logo-img" width="220" height="60" decoding="async">
      </a>
    </div>
    <button id="menu-toggle" class="menu-toggle">☰</button>
    <nav class="main-nav">
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="releases.html">Releases</a>
        <a href="artists.html">Artists</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <!-- HERO -->
  <div class="home-hero">
    <img id="home-hero" class="hero-image"
         src="/.netlify/images?url=/uploads/Oysterdale_forsidebilde_nettside_optimized.webp&w=1200&fm=webp&q=50&fit=cover"
         alt="Oysterdale Records hero image">
  </div>

  <main class="page-content">
    <div id="home-content">
      <div class="skeleton" style="height:14px;width:55%;margin:12px 0;"></div>
    </div>

    <!-- Latest Release -->
    <section class="latest-wrap">
      <h2>Latest Release</h2>
      <div id="latest-release"><div class="skeleton" style="height:300px;border-radius:10px;"></div></div>
    </section>
  </main>

  <!-- FOOTER loader -->
  <script>
    (function(){
      function loadFooter(){
        document.body.insertAdjacentHTML('beforeend',
          `<footer><p>© 2025 Oysterdale Records. All rights reserved.</p></footer>`);
      }
      window.addEventListener('load', loadFooter);
    })();
  </script>

  <!-- Latest Release loader -->
  <script>
    (function(){
      const OWNER="Oysterdale", REPO="oysterdale-site", DIR="releases";

      function clean(v){return (v??"").toString().trim();}
      function niceDate(iso){
        if(!iso) return "";
        const d=new Date(iso);
        return isNaN(d)?iso:d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
      }

      function parseFrontmatter(md){
        const parts=md.split('---'); if(parts.length<3) return{data:{},body:md};
        const yaml=parts[1], body=parts.slice(2).join('---').trim(), data={};
        const lines=yaml.split(/\r?\n/); let currentList=null;
        for(const line of lines){
          if(!line.trim()) continue;
          const listStart=line.match(/^([A-Za-z0-9_]+):\s*$/);
          if(listStart){currentList=listStart[1]; data[currentList]=[]; continue;}
          if(currentList && /^\s*-\s+/.test(line)){
            data[currentList].push(line.replace(/^\s*-\s+/,'').trim()); continue;
          }
          const m=line.match(/^([^:]+):\s*(.*)$/);
          if(m){data[m[1].trim()]=m[2].trim();}
        }
        return{data,body};
      }

      async function fetchLatest(){
        const list=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`).then(r=>r.json());
        const files=list.filter(f=>f.name.endsWith(".md"));
        const entries=await Promise.all(files.map(async f=>{
          const md=await fetch(f.download_url).then(r=>r.text());
          const {data}=parseFrontmatter(md);
          return{data,date:new Date(data.date||0)};
        }));
        entries.sort((a,b)=>b.date-a.date);
        return entries[0]?.data;
      }

      function renderLatest(data){
        const wrap=document.getElementById('latest-release'); if(!wrap) return;
        let artists="";
        if(Array.isArray(data.artists)) artists=data.artists.join(" | ");
        else artists=clean(data.artists||data.artist);
        wrap.innerHTML=`
          <div class="release latest">
            <div class="release-header">
              ${artists?`<h2 class="release-artist">${artists}</h2>`:""}
              ${data.title?`<h3 class="release-title">${data.title}</h3>`:""}
            </div>
            ${data.cover?`<a href="/releases"><img src="${data.cover}" class="release-cover"></a>`:""}
            ${data.date?`<p class="release-date">Release date: ${niceDate(data.date)}</p>`:""}
          </div>`;
      }

      document.addEventListener('DOMContentLoaded',async()=>{
        const latest=await fetchLatest(); if(latest) renderLatest(latest);
      });
    })();
  </script>

  <!-- Meny -->
  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      const btn=document.getElementById('menu-toggle');
      const nav=document.querySelector('.main-nav');
      btn.addEventListener('click',()=>{
        nav.classList.toggle('open');
        btn.textContent=nav.classList.contains('open')?'✖':'☰';
      });
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded',()=>{document.body.classList.remove('preload');});
  </script>
</body>
</html>
