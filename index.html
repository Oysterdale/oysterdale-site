  <title>Oysterdale Records</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .intro-section {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: white;
    }

    .spotify-embed {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
    }

    .spotify-embed iframe {
      width: 100%;
      max-width: 600px;
      height: 600px;
      border-radius: 12px;
    }

    @media (max-width: 768px) {
      .spotify-embed iframe {
        height: 500px;
      }
    }
  </style>
</head>
<body>

  <!-- Header settes inn dynamisk -->
  <div class="home-hero"></div>

  <main class="page-content">
      <div id="home-content">Loading content...</div>

    <section class="intro-section">
      <!-- Spotify embed -->
      <div class="spotify-embed">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/1euFegx110KGHeMkYOam6e?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>      
      </div>
    </section>
  </main>

  <footer>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <a href="https://on.soundcloud.com/rVdOdUhqw6MG3IcPRs">
      <img src="images/pearl.png" alt="An image of a pearl" class="footer-pearl"/>
    </a>
    <p><b><em>YOU FOUND A HIDDEN PEARL</em></b></p>

    <div class="footer-logo">
      <img src="uploads/OysterdaleRecords_white_logo.png" alt="Oysterdale Records Logo" class="footer-logo-img">
    </div>
    <p>&copy; 2025 Oysterdale Records. All rights reserved.</p>
  </footer>

  <script>
    // Sett inn header øverst i body og aktiver meny
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.body.insertAdjacentHTML('afterbegin', html);

        const toggleButton = document.getElementById('menu-toggle');
        const nav = document.querySelector('.main-nav');
        const navLinks = document.querySelectorAll('.main-nav a');

        if (toggleButton && nav) {
          toggleButton.addEventListener('click', () => {
            nav.classList.toggle('open');
            toggleButton.textContent = nav.classList.contains('open') ? '✖' : '☰';
          });

          navLinks.forEach(link => {
            link.addEventListener('click', () => {
              if (nav.classList.contains('open')) {
                nav.classList.remove('open');
                toggleButton.textContent = '☰';
              }
            });
          });
        }
      });

    fetch('content/index.md')
      .then(res => res.text())
      .then(md => {
        document.getElementById('home-content').innerHTML = marked.parse(md);
      });
  </script>
</body>
</html>
